# Cloudflare Worker: reserve-sightings relay for the New Eden Atlas.
# Deployed by Cloudflare's Git integration (Workers Builds) on every push,
# from the repository root, deploy command "npx wrangler deploy".
# The KV namespace has no id: Wrangler 4.45+ creates and links it on the
# first deploy (automatic resource provisioning).
name = "atlas-sightings"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[vars]
CLIENT_ID = "38a2c041bdfd428ebd8cb580b750efdd"
ALLOWED_ORIGINS = "https://idan-armstrong.github.io,http://localhost:8765"
# Atlas operator characters (comma separated): reset org passwords, settle disputes
OPERATORS = "Varg Soth"
# development: "1" = orgs ask for no passwords and approve joins at once; "0" = passwords and approval
ORG_OPEN = "1"

[[kv_namespaces]]
binding = "SIGHTINGS"

# corp-mate positions: one Durable Object per corporation (SQLite storage,
# available on the free plan)
[[durable_objects.bindings]]
name = "CORP"
class_name = "CorpRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CorpRoom"]

# Atlas organizations: one directory for every org (membership, roles,
# password hashes); each org's shared data lives in a CorpRoom named org:<id>
[[durable_objects.bindings]]
name = "ORGS"
class_name = "OrgDirectory"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["OrgDirectory"]

# J-Space Survey planet scan pictures (private: served only through the relay
# to pilots allowed to read the scan)
[[r2_buckets]]
binding = "SHOTS"
bucket_name = "atlas-survey-shots"
