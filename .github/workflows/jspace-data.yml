name: Static reference data (J-space, item facts, blueprints)

# Run by hand when CCP publishes a new SDE. Rebuilds web/data/jspace/*.json and
# commits them to master if anything changed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the SDE (JSON Lines)
        run: |
          curl -fsSL -o sde.zip \
            -A "J-Space Survey (https://idan-armstrong.github.io/eve-assistant/)" \
            https://developers.eveonline.com/static-data/eve-online-static-data-latest-jsonl.zip
          unzip -l sde.zip | head -60
      - name: Build J-space data
        run: python tools/build_jspace.py sde.zip web/data/jspace
      - name: Build item facts (market filters)
        run: python tools/build_type_meta.py sde.zip web/data/type_meta.json
      - name: Build blueprints (blueprint finder)
        run: python tools/build_blueprints.py sde.zip web/data/blueprints.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/jspace/systems.json web/data/jspace/wormholes.json web/data/jspace/classes.json web/data/jspace/scan_types.json web/data/type_meta.json web/data/blueprints.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "J-space reference data from the latest SDE"
          git push
