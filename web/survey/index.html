<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N-Space Survey</title>
<meta name="description" content="Wormhole chain mapper that feeds the New Eden Atlas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600&display=swap">
<style>
  :root {
    --bg: #060a12; --panel: #0d131f; --panel-edge: #1c2638; --ink: #c9d4e3;
    --ink-dim: #6aa9ff; --ink-faint: #3f7fd6; --focus: #9fc1ff;
    --ok: #57c27a; --warn: #e3a33b; --bad: #e0524f;
    --c1: #5fb3ff; --c2: #47d6c6; --c3: #8fd14f; --c4: #e0c84a; --c5: #e78c3c; --c6: #e0524f;
    --hs: #4fd17a; --ls: #e3a33b; --ns: #d9534f; --sp: #c58cff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px "Chakra Petch", "Segoe UI", system-ui, sans-serif;
         display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  a { color: var(--ink-dim); }
  button, input, select, textarea { font: inherit; color: var(--ink); background: #0a101b;
         border: 1px solid var(--panel-edge); border-radius: 4px; }
  button { cursor: pointer; padding: 4px 10px; }
  button:hover { border-color: var(--ink-faint); }
  button.primary { border-color: var(--ink-dim); color: #e8f1ff; }
  input, select { padding: 3px 6px; }
  textarea { width: 100%; padding: 6px; resize: vertical; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px;
           border-bottom: 1px solid var(--panel-edge); background: var(--panel); }
  .wordmark { font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 16px; }
  .wordmark small { display: block; font-weight: 300; letter-spacing: .04em; text-transform: none;
                    color: var(--ink-dim); font-size: 12px; }
  .spacer { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--panel-edge);
          border-radius: 12px; font-size: 12px; }
  .chip .where { color: var(--ink-dim); }
  .chip.off { opacity: .55; }
  .status { font-size: 12px; color: var(--ink-dim); }
  .status.err { color: var(--bad); }

  main { display: grid; grid-template-columns: 1fr 430px; min-height: 0; }
  main[hidden] { display: none; }
  button.chip { background: transparent; cursor: pointer; }
  .chip.ok { border-color: var(--ok); color: var(--ok); }
  .chip.warn { border-color: var(--warn); color: var(--warn); }
  .views { display: inline-flex; border: 1px solid var(--panel-edge); border-radius: 6px; overflow: hidden; }
  .views button { border: 0; border-radius: 0; background: transparent; }
  .views button[aria-pressed="true"] { background: #15203a; color: #e8f1ff; }

  /* surveyor view: built for a second screen */
  .sv { grid-template-columns: 1.15fr 1fr 0.9fr; grid-template-rows: auto minmax(0, 1fr) 190px; gap: 10px; padding: 10px; overflow: hidden; }
  .card { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 8px; padding: 12px; overflow: auto; min-height: 0; }
  .card h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  .card .big { font-size: 34px; font-weight: 600; line-height: 1.15; margin: 2px 0 4px; }
  .card .big .cls { font-size: 20px; font-weight: 400; }
  .card.ok { border-color: #1f5a35; } .card.warn { border-color: var(--warn); } .card.bad { border-color: var(--bad); animation: pulse 1s infinite alternate; }
  .card.ok .countdown { color: var(--ok); } .card.warn .countdown { color: var(--warn); } .card.bad .countdown { color: var(--bad); }
  .big.ok { color: var(--ok); }
  .countdown { font-variant-numeric: tabular-nums; font-size: 44px !important; }
  @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(224,82,79,.0); } to { box-shadow: 0 0 18px 2px rgba(224,82,79,.55); } }
  #svFeed { grid-column: 1 / -1; }
  ul.feed { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  ul.feed li { padding: 2px 0; border-bottom: 1px solid #111a2a; }
  ul.feed li.pts { color: var(--ok); } ul.feed li.medal { color: #ffd34d; } ul.feed li.warn { color: var(--warn); }
  ul.feed li.bad { color: var(--bad); font-weight: 600; } ul.feed li.jump { color: var(--focus); }
  ul.tight { margin: 4px 0 8px; padding-left: 18px; font-size: 13px; }
  .bar { height: 6px; background: #111a2a; border-radius: 3px; margin: 6px 0 10px; }
  .bar span { display: block; height: 100%; background: var(--ink-dim); border-radius: 3px; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .badge { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; font-size: 10px; font-weight: 600;
           border: 1px dashed var(--panel-edge); color: #3a4560; }
  .badge.got { border: 2px solid #ffd34d; color: #ffd34d; background: #2a2410; }
  tr.fresh td { color: #ffd34d; }
  .st { font-size: 11px; padding: 0 5px; border-radius: 6px; border: 1px solid currentColor; }
  .st-unscanned { color: var(--warn); } .st-to-finish { color: #ffd34d; } .st-identified { color: var(--ok); }
  .st-ready { color: var(--focus); }
  .link.picked { border-color: var(--focus); }
  .seg { gap: 4px; }
  .seg .hint { width: 58px; }
  .seg button { padding: 2px 8px; font-size: 12px; }
  .seg button.on { border-color: var(--focus); background: #15203a; color: #e8f1ff; }
  .modal { max-height: 85vh; overflow: auto; min-width: 380px; }
  .batch { margin-top: 10px; border-top: 1px solid var(--panel-edge); padding-top: 8px; }
  ol.blist { margin: 4px 0; padding-left: 0; list-style: none; font-size: 13px; }
  ol.blist li.done { opacity: .55; } ol.blist li.here { font-weight: 600; }
  #chainWrap { position: relative; overflow: auto; min-height: 0; }
  #chainBar { position: sticky; top: 0; left: 0; z-index: 2; display: flex; gap: 8px; align-items: center;
              padding: 8px 12px; background: rgba(6,10,18,.92); border-bottom: 1px solid var(--panel-edge); flex-wrap: wrap; }
  #chain { display: block; }
  .empty { padding: 40px; max-width: 640px; color: var(--ink-dim); line-height: 1.6; }
  .empty b { color: var(--ink); }

  aside { border-left: 1px solid var(--panel-edge); background: var(--panel); overflow: auto; min-height: 0; padding: 14px; }
  aside h2 { margin: 0 0 2px; font-size: 20px; }
  aside h3 { margin: 18px 0 6px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  .meta { color: var(--ink-dim); font-size: 12px; line-height: 1.5; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
  .link { border: 1px solid var(--panel-edge); border-radius: 6px; padding: 8px; margin: 6px 0; }
  .link.unsure { border-style: dashed; border-color: var(--warn); }
  .link .to { font-weight: 600; cursor: pointer; }
  .link select, .link input { max-width: 132px; }
  .link .to:hover { color: var(--focus); }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 8px; border: 1px solid currentColor; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--panel-edge); vertical-align: top; }
  th { color: var(--ink-dim); font-weight: 400; }
  td.x { width: 20px; text-align: right; }
  .xbtn { padding: 0 5px; font-size: 11px; }
  .hint { font-size: 12px; color: var(--ink-faint); line-height: 1.5; }
  #suggest { position: absolute; z-index: 5; background: var(--panel); border: 1px solid var(--panel-edge);
             max-height: 220px; overflow: auto; min-width: 220px; }
  #suggest div { padding: 4px 8px; cursor: pointer; }
  #suggest div:hover, #suggest div.on { background: #15203a; }
  .toast { position: fixed; bottom: 16px; left: 16px; background: var(--panel); border: 1px solid var(--ink-faint);
           padding: 10px 14px; border-radius: 6px; max-width: 420px; z-index: 10; }
  .consent { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 2000; }
  .consent > div { background: var(--panel); border: 1px solid var(--ink-faint); border-radius: 8px; padding: 18px;
                   max-width: 520px; line-height: 1.5; }

  /* systems view (J-Space Survey) */
  .js { grid-template-columns: minmax(280px, 0.9fr) 1.3fr minmax(260px, 0.8fr); gap: 10px; padding: 10px; overflow: hidden; }
  .jtable tr.jrow { cursor: pointer; }
  .jtable tr.jrow:hover td, .jtable tr.jrow.on td { background: #15203a; }
  .jres { display: grid; gap: 8px; }
  .jr { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: center; border: 1px solid var(--panel-edge); border-radius: 6px; padding: 6px; }
  .jthumb { width: 150px; height: 100px; display: grid; place-items: center; background: #0a101b; border-radius: 4px; overflow: hidden; cursor: zoom-in; }
  .jthumb img { width: 100%; height: 100%; object-fit: contain; }
  .jd { display: inline-block; width: 140px; height: 8px; background: #111a2a; border-radius: 4px; overflow: hidden; }
  .jd span { display: block; height: 100%; background: linear-gradient(90deg, var(--c1), var(--c4), var(--c6)); }
  .jcap { border: 1px solid var(--panel-edge); border-radius: 6px; padding: 6px 8px; margin: 6px 0; font-size: 13px; }
  .jcap.ok { border-color: #1f5a35; color: var(--ok); } .jcap.bad { border-color: var(--bad); color: var(--bad); } .jcap.warn { border-color: var(--warn); }
  .ok-text { color: var(--ok); margin: 0 0 6px; }
  @media (max-width: 1100px) { .js { grid-template-columns: 1fr; overflow: auto; } }

  /* ---- 3D system view ---------------------------------------------- */
  #orrery {
    position: fixed; inset: 0; z-index: 1500; display: none;
    background: radial-gradient(ellipse at 50% 45%, #0a101d 0%, #05080f 75%);
  }
  #orrery canvas { position: absolute; inset: 0; }
  .orr-top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 18px; pointer-events: none;
  }
  .orr-top > * { pointer-events: auto; }
  .orr-crumbs { font-size: 12px; color: var(--ink-dim); }
  .orr-title { font-size: 24px; font-weight: 600; letter-spacing: .03em; }
  .orr-title span { font-size: 16px; margin-left: 10px; }
  .orr-close {
    background: rgba(13,19,31,.85); color: var(--ink);
    border: 1px solid var(--panel-edge); border-radius: 3px;
    font: inherit; font-size: 13px; padding: 7px 14px; cursor: pointer;
  }
  .orr-close:hover { background: #162032; }
  .orr-close:focus-visible { outline: 2px solid var(--focus); }
  .orr-note {
    position: absolute; bottom: 14px; left: 18px; z-index: 2;
    font-size: 11.5px; color: var(--ink-faint); line-height: 1.9;
  }
  .orr-key { margin-right: 14px; color: var(--ink-dim); }
  .orr-key i { display: inline-block; margin-right: 5px; vertical-align: -1px; }
  .k-gate { width: 9px; height: 9px; background: #e8d26a; transform: rotate(45deg); }
  .k-station { width: 11px; height: 5px; background: #9fd9ff; }
  .k-st-basic { background: #9fd9ff; }
  .k-st-market { background: #74c476; margin-left: 8px; }
  .k-st-industry { background: #e0a84f; margin-left: 8px; }
  .k-st-cloning { background: #e8828c; margin-left: 8px; }
  .k-starred { color: #ffd966; margin-left: 8px; }
  .k-belt { width: 10px; height: 10px;
    background: radial-gradient(circle at 30% 40%, #c9a86a 1.5px, transparent 2px),
                radial-gradient(circle at 70% 30%, #c9a86a 1.5px, transparent 2px),
                radial-gradient(circle at 55% 75%, #c9a86a 1.5px, transparent 2px); }
  .k-moon { width: 7px; height: 7px; border-radius: 50%; background: #9aa4b5; }
  .orr-label {
    position: absolute; z-index: 3; white-space: nowrap;
    font-size: 12.5px; font-weight: 600; color: #eef3fa; pointer-events: none;
    text-shadow: 0 0 2px #05080f, 0 0 5px #05080f, 0 1px 3px #000, 0 0 9px #05080f;
  }
  .orr-label.gate { color: #f2dc72; }
  .orr-tip {
    position: absolute; z-index: 3; pointer-events: none;
    background: rgba(13,19,31,.95); border: 1px solid var(--panel-edge);
    border-radius: 3px; padding: 6px 10px; font-size: 12px; max-width: 280px;
  }
  .orr-tip b { font-weight: 600; }
  .orr-profile {
    position: absolute; top: 76px; right: 18px; z-index: 4;
    width: 272px; max-height: calc(100% - 130px); overflow-y: auto;
    background: rgba(11,16,26,.96); border: 1px solid var(--panel-edge);
    border-radius: 3px; padding: 13px 15px 11px;
  }
  .orr-pkind { font-size: 11px; color: var(--ink-dim); }
  .orr-pname { font-size: 15.5px; font-weight: 600; margin: 2px 0 9px; line-height: 1.3; }
  .orr-profile table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .orr-profile td { padding: 3.5px 0; vertical-align: top; }
  .orr-profile td:first-child { color: var(--ink-dim); padding-right: 10px; white-space: nowrap; }
  .orr-profile td:last-child { text-align: right; }
  .orr-pclose {
    position: absolute; top: 6px; right: 6px;
    background: none; border: 0; color: var(--ink-dim);
    font-size: 14px; cursor: pointer; padding: 3px 7px;
  }
  .orr-pclose:hover { color: var(--ink); }
  .orr-pclose:focus-visible { outline: 2px solid var(--focus); }
  .orr-label.pl.scanned { color: #8ff0b0; }
  .orr-profile td img { display: block; width: 100%; max-width: 230px; margin: 4px 0 2px auto; border-radius: 3px; cursor: zoom-in; }
  .orr-profile { width: 300px; }

  svg text { font-family: inherit; }
  .node rect { fill: #0b1220; stroke: var(--panel-edge); stroke-width: 1.5; }
  .node.sel rect { stroke: var(--focus); stroke-width: 2.5; }
  .node.root rect { stroke-dasharray: 4 3; }
  .node { cursor: pointer; }

  @media (max-width: 1100px) {
    .sv { grid-template-columns: 1fr 1fr; grid-template-rows: auto; overflow: auto; }
    #svFeed { grid-column: 1 / -1; }
  }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; overflow: auto; }
    body { overflow: auto; }
    aside { border-left: 0; border-top: 1px solid var(--panel-edge); }
  }
</style>
</head>
<body>
<header>
  <div class="wordmark"><span id="wmName">N-Space Survey</span><small id="wmSub">wormhole chain mapper for the New Eden Atlas</small></div>
  <a href="../">Back to Atlas</a>
  <nav class="views"><button data-view="surveyor" aria-pressed="true">Surveyor</button><button data-view="chain" aria-pressed="false">Chain</button><button data-view="systems" aria-pressed="false" title="J-Space Survey: systems, planets and scans">Systems</button></nav>
  <span class="spacer"></span>
  <button id="linkChip" class="chip off">Survey Link off</button>
  <button id="scoreChip" class="chip" title="Your survey rank and points">Cadet · 0 pts</button>
  <span id="pilots"></span>
  <label class="chip" id="shareWrap" hidden><input type="checkbox" id="share"> share map with corp</label>
  <button id="login" class="primary">Log in with EVE</button>
  <span id="sync" class="status"></span>
</header>
<main id="surveyorView" class="sv">
  <section id="svSystem" class="card"></section>
  <section id="svHome" class="card"></section>
  <section id="svScore" class="card"></section>
  <section id="svSigs" class="card"></section>
  <section id="svLinks" class="card"></section>
  <section id="svDscan" class="card"></section>
  <section id="svFeed" class="card"></section>
</main>
<main id="systemsView" class="js" hidden>
  <section id="jsSystem" class="card"></section>
  <section id="jsPlanet" class="card"></section>
  <section id="jsCapture" class="card"></section>
</main>
<main id="chainView" hidden>
  <section id="chainWrap">
    <div id="chainBar">
      <span class="hint">Root</span>
      <input id="rootInput" placeholder="system name" autocomplete="off" size="16">
      <button id="rootHere" title="Root the chain where a tracked pilot is">Where I am</button>
      <button id="rootHome" title="Root the chain at your saved home">Home</button>
      <button id="setHome" title="Save the current root as home">Save as home</button>
      <span class="spacer"></span>
      <span id="counts" class="hint"></span>
    </div>
    <svg id="chain" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="empty" class="empty" hidden></div>
  </section>
  <aside id="side"><p class="hint">Pick a system in the chain, or type one in the Root box.</p></aside>
</main>
<div id="orrery" role="region" aria-label="3D system view"></div>
<div id="suggest" hidden></div>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js" } }</script>
<script src="../sso.js"></script>
<script type="module" src="survey.js"></script>
</body>
</html>
