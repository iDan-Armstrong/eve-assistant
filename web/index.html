<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Eden Atlas</title>
<meta name="description" content="Interactive star atlas of the EVE Online universe: 5,432 solar systems, every stargate connection, full attribute data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
<style>
  :root {
    --bg: #060a12;
    --panel: #0d131f;
    --panel-edge: #1c2638;
    --ink: #c9d4e3;
    --ink-dim: #6b7891;
    --ink-faint: #3d4860;
    --focus: #9fc1ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; background: var(--bg); }
  .leaflet-container { font: inherit; }

  /* ---- top bar ---------------------------------------------------- */
  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1300;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px;
    background: linear-gradient(rgba(6,10,18,.92), rgba(6,10,18,.75) 70%, rgba(6,10,18,0));
    pointer-events: none;
  }
  header > * { pointer-events: auto; }
  .wordmark {
    font-weight: 600; letter-spacing: .34em; font-size: 15px;
    color: var(--ink); white-space: nowrap; user-select: none;
  }
  .wordmark span { color: var(--ink-dim); font-weight: 300; letter-spacing: .1em; font-size: 11px; margin-left: 10px; }
  .wordmark .preview-tag {
    color: #e8a13c; border: 1px solid #6b4a1c; border-radius: 3px;
    padding: 1px 6px; font-weight: 600; letter-spacing: .08em; font-size: 10.5px;
  }

  .search { position: relative; flex: 0 1 340px; }
  .search input {
    width: 100%; padding: 7px 12px;
    background: rgba(13,19,31,.85); color: var(--ink);
    border: 1px solid var(--panel-edge); border-radius: 3px;
    font: inherit; font-size: 13px;
  }
  .search input::placeholder { color: var(--ink-faint); }
  .search input:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
  .search .results {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 3px;
    max-height: 290px; overflow-y: auto; display: none;
  }
  .search .results.open { display: block; }
  .search .results button {
    display: flex; justify-content: space-between; gap: 10px; width: 100%;
    padding: 7px 12px; background: none; border: 0; color: var(--ink);
    font: inherit; font-size: 13px; text-align: left; cursor: pointer;
  }
  .search .results button:hover, .search .results button:focus-visible { background: #16203233; outline: none; background: #162032; }
  .search .results .where { color: var(--ink-dim); font-size: 12px; }

  .toggles { margin-left: auto; position: relative; }
  .toggles summary {
    list-style: none; cursor: pointer; user-select: none;
    background: rgba(13,19,31,.85); border: 1px solid var(--panel-edge); border-radius: 3px;
    color: var(--ink); font-size: 12.5px; padding: 6px 12px;
  }
  .toggles summary::-webkit-details-marker { display: none; }
  .toggles summary::after { content: " ▾"; color: var(--ink-dim); }
  .toggles[open] summary { background: #1b2a44; }
  .toggles summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .toggle-menu {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 1200;
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 3px;
    padding: 8px 12px; display: grid; gap: 7px; min-width: 190px;
  }
  .toggles label {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--ink-dim); cursor: pointer; white-space: nowrap;
  }
  .toggles input { accent-color: #4a6a9b; }
  .toggles .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 2px solid; margin-right: 1px; }
  .toggles input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---- legend + stats --------------------------------------------- */
  .legend {
    position: absolute; left: 14px; bottom: 26px; z-index: 1100;
    background: rgba(13,19,31,.85); border: 1px solid var(--panel-edge); border-radius: 3px;
    padding: 9px 12px 8px; user-select: none;
  }
  .legend .ramp { display: flex; gap: 2px; margin-bottom: 5px; }
  .legend .ramp i { width: 17px; height: 8px; border-radius: 1px; }
  .legend .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-dim); }
  /* ---- layer switch -------------------------------------------------- */
  .layers { display: flex; border: 1px solid var(--panel-edge); border-radius: 3px;
    overflow: hidden; background: rgba(13,19,31,.85); }
  .layers button {
    background: none; border: 0; border-right: 1px solid var(--panel-edge);
    color: var(--ink-dim); font: inherit; font-size: 12.5px; padding: 6px 11px; cursor: pointer;
    white-space: nowrap;
  }
  .layers button:last-child { border-right: 0; }
  .layers button small { font-size: 10.5px; opacity: .75; margin-left: 2px; }
  .layers button[aria-pressed="true"] { background: #1b2a44; color: #fff; }
  .layers button:hover:not(:disabled) { color: var(--ink); }
  .layers button:disabled { opacity: .45; cursor: default; }
  .layers button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

  /* ---- risk legend + panel ------------------------------------------ */
  .risk-title { font-size: 12px; color: var(--ink); margin-bottom: 6px; }
  .risk-ramp { display: grid; grid-template-columns: repeat(5, auto); gap: 3px 10px;
    font-size: 11px; color: var(--ink-dim); }
  .risk-ramp span { white-space: nowrap; }
  .risk-ramp i { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: 4px; vertical-align: -1px; }
  .risk-live { margin-top: 6px; font-size: 10.5px; color: var(--ink-faint); }
  .risk-box { margin: 8px 0 2px; font-size: 12px; color: var(--ink-dim); line-height: 1.45; }
  .risk-box:empty { display: none; }
  .risk-box .rb-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; margin-bottom: 3px; }
  .risk-box .rb-level { font-weight: 600; font-size: 13px; }
  .risk-box .rb-line { padding-left: 2px; }
  .risk-box .rb-note { color: var(--ink-faint); font-size: 11px; margin-top: 2px; }

  .bulwark-key { margin-top: 7px; font-size: 11px; color: var(--ink-dim); }
  .bulwark-key .bk-ring { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    border: 2px dashed #5fa8d3; vertical-align: -2px; margin-right: 3px; }
  .bulwark-key .bk-item { margin-left: 8px; white-space: nowrap; }
  .bulwark-key .bk-hq { border-style: double; border-width: 3px; border-color: var(--ink-dim); }
  .bulwark-key .bk-src { display: block; color: var(--ink-faint); font-size: 10.5px; margin-top: 2px; }
  .legend .stats { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--panel-edge); font-size: 11px; color: var(--ink-dim); }

  /* ---- info panel -------------------------------------------------- */
  .panel {
    position: absolute; top: 56px; right: 14px; z-index: 1100;
    width: 300px; max-width: calc(100vw - 28px); max-height: calc(100vh - 92px);
    background: rgba(11,16,26,.97); backdrop-filter: blur(5px);
    border: 1px solid var(--panel-edge); border-radius: 3px;
    transform: translateX(calc(100% + 18px));
    transition: transform .25s ease;
    display: flex; flex-direction: column;
  }
  .panel.open { transform: none; }
  .panel-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--panel-edge); }
  .panel-head .crumbs { font-size: 12px; color: var(--ink-dim); margin-bottom: 3px; }
  .panel-head h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .02em; display: flex; align-items: baseline; gap: 10px; }
  .sec-chip { font-size: 16px; font-weight: 600; }
  .panel-head .sec-true { font-size: 11.5px; color: var(--ink-dim); margin-top: 2px; }
  .panel-close {
    position: absolute; top: 8px; right: 8px;
    background: none; border: 0; color: var(--ink-dim); font-size: 17px;
    cursor: pointer; padding: 4px 8px; line-height: 1; border-radius: 3px;
  }
  .panel-close:hover { color: var(--ink); }
  .panel-close:focus-visible { outline: 2px solid var(--focus); }
  .panel-body { padding: 12px 16px; overflow-y: auto; min-height: 0; }
  .attr-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
    text-align: center; margin-bottom: 4px;
  }
  .attr-grid .v { font-size: 17px; font-weight: 600; }
  .attr-grid .k { font-size: 10.5px; color: var(--ink-dim); }
  .flags { font-size: 12px; color: var(--ink-dim); margin: 8px 0 2px; min-height: 1em; }
  .neighbors h3 {
    margin: 14px 0 6px; font-size: 12px; font-weight: 400; color: var(--ink-dim);
    border-top: 1px solid var(--panel-edge); padding-top: 12px;
  }
  .neighbors button {
    display: flex; justify-content: space-between; align-items: baseline; width: 100%;
    background: none; border: 0; border-radius: 3px;
    color: var(--ink); font: inherit; font-size: 13px;
    padding: 5px 8px; cursor: pointer;
  }
  .neighbors button:hover, .neighbors button:focus-visible { background: #162032; outline: none; }
  .neighbors .via { color: var(--ink-dim); font-size: 11.5px; }
  .stations h3 {
    margin: 14px 0 6px; font-size: 12px; font-weight: 400; color: var(--ink-dim);
    border-top: 1px solid var(--panel-edge); padding-top: 12px;
  }
  .stations ul { margin: 0; padding: 0; list-style: none; }
  .stations li {
    font-size: 12px; color: var(--ink); padding: 3px 8px;
    border-left: 2px solid var(--panel-edge);
    margin-bottom: 2px; line-height: 1.35;
  }
  .stations li .at { color: var(--ink-dim); }
  .star-line { font-size: 12px; color: var(--ink-dim); margin-top: 6px; }
  .star-line b { color: var(--ink); font-weight: 400; }
  .view3d {
    margin-top: 10px; width: 100%;
    background: #16233a; color: var(--ink); border: 1px solid #2b3c5c;
    border-radius: 3px; font: inherit; font-size: 12.5px;
    padding: 6px 10px; cursor: pointer;
  }
  .view3d:hover { background: #1c2d4a; }
  .view3d:focus-visible { outline: 2px solid var(--focus); }

  /* ---- 3D system view ---------------------------------------------- */
  #orrery {
    position: absolute; inset: 0; z-index: 1500; display: none;
    background: radial-gradient(ellipse at 50% 45%, #0a101d 0%, #05080f 75%);
  }
  #orrery canvas { position: absolute; inset: 0; }
  .orr-top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 18px; pointer-events: none;
  }
  .orr-top > * { pointer-events: auto; }
  .orr-crumbs { font-size: 12px; color: var(--ink-dim); }
  .orr-title { font-size: 24px; font-weight: 600; letter-spacing: .03em; }
  .orr-title span { font-size: 16px; margin-left: 10px; }
  .orr-close {
    background: rgba(13,19,31,.85); color: var(--ink);
    border: 1px solid var(--panel-edge); border-radius: 3px;
    font: inherit; font-size: 13px; padding: 7px 14px; cursor: pointer;
  }
  .orr-close:hover { background: #162032; }
  .orr-close:focus-visible { outline: 2px solid var(--focus); }
  .orr-note {
    position: absolute; bottom: 14px; left: 18px; z-index: 2;
    font-size: 11.5px; color: var(--ink-faint); line-height: 1.9;
  }
  .orr-key { margin-right: 14px; color: var(--ink-dim); }
  .orr-key i { display: inline-block; margin-right: 5px; vertical-align: -1px; }
  .k-gate { width: 9px; height: 9px; background: #e8d26a; transform: rotate(45deg); }
  .k-station { width: 11px; height: 5px; background: #9fd9ff; }
  .k-st-basic { background: #9fd9ff; }
  .k-st-market { background: #74c476; margin-left: 8px; }
  .k-st-industry { background: #e0a84f; margin-left: 8px; }
  .k-st-cloning { background: #e8828c; margin-left: 8px; }
  .k-starred { color: #ffd966; margin-left: 8px; }
  .k-belt { width: 10px; height: 10px;
    background: radial-gradient(circle at 30% 40%, #c9a86a 1.5px, transparent 2px),
                radial-gradient(circle at 70% 30%, #c9a86a 1.5px, transparent 2px),
                radial-gradient(circle at 55% 75%, #c9a86a 1.5px, transparent 2px); }
  .k-moon { width: 7px; height: 7px; border-radius: 50%; background: #9aa4b5; }
  .orr-label {
    position: absolute; z-index: 3; white-space: nowrap;
    font-size: 12.5px; font-weight: 600; color: #eef3fa; pointer-events: none;
    text-shadow: 0 0 2px #05080f, 0 0 5px #05080f, 0 1px 3px #000, 0 0 9px #05080f;
  }
  .orr-label.gate { color: #f2dc72; }
  .orr-tip {
    position: absolute; z-index: 3; pointer-events: none;
    background: rgba(13,19,31,.95); border: 1px solid var(--panel-edge);
    border-radius: 3px; padding: 6px 10px; font-size: 12px; max-width: 280px;
  }
  .orr-tip b { font-weight: 600; }
  .orr-profile {
    position: absolute; top: 76px; right: 18px; z-index: 4;
    width: 272px; max-height: calc(100% - 130px); overflow-y: auto;
    background: rgba(11,16,26,.96); border: 1px solid var(--panel-edge);
    border-radius: 3px; padding: 13px 15px 11px;
  }
  .orr-pkind { font-size: 11px; color: var(--ink-dim); }
  .orr-pname { font-size: 15.5px; font-weight: 600; margin: 2px 0 9px; line-height: 1.3; }
  .orr-profile table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .orr-profile td { padding: 3.5px 0; vertical-align: top; }
  .orr-profile td:first-child { color: var(--ink-dim); padding-right: 10px; white-space: nowrap; }
  .orr-profile td:last-child { text-align: right; }
  .orr-pclose {
    position: absolute; top: 6px; right: 6px;
    background: none; border: 0; color: var(--ink-dim);
    font-size: 14px; cursor: pointer; padding: 3px 7px;
  }
  .orr-pclose:hover { color: var(--ink); }
  .orr-pclose:focus-visible { outline: 2px solid var(--focus); }
  .cel h3 {
    margin: 14px 0 6px; font-size: 12px; font-weight: 400; color: var(--ink-dim);
    border-top: 1px solid var(--panel-edge); padding-top: 12px;
  }
  .cel details { margin-bottom: 2px; }
  .cel summary {
    font-size: 12.5px; padding: 4px 8px; cursor: pointer; border-radius: 3px;
    list-style-position: outside; display: flex; justify-content: space-between; gap: 8px;
  }
  .cel summary::-webkit-details-marker { display: none; }
  .cel summary:hover, .cel summary:focus-visible { background: #162032; outline: none; }
  .cel summary .what { color: var(--ink-dim); font-size: 11.5px; white-space: nowrap; }
  .cel details[open] summary { color: #e4ecf7; }
  .cel ul { margin: 2px 0 6px; padding: 0 0 0 16px; list-style: none; }
  .cel li { font-size: 11.5px; color: var(--ink-dim); padding: 1.5px 0; border-left: 2px solid var(--panel-edge); padding-left: 8px; }
  .cel li.belt { color: #a78d5c; border-left-color: #4a3f28; }
  .cel .nomoons { cursor: default; }
  .cel .nomoons:hover { background: none; }
  .panel-foot { padding: 9px 16px; border-top: 1px solid var(--panel-edge); font-size: 11px; color: var(--ink-faint); }

  /* ---- map labels --------------------------------------------------- */
  .region-label, .sys-label { background: none; border: 0; }
  /* labels: absolutely placed by the collision pass (left/top inline) */
  .region-label div, .sys-label div { position: absolute; white-space: nowrap; }
  .region-label div {
    color: #ffffff; font-size: 15px; font-weight: 700; letter-spacing: .2em;
    line-height: 18px;
    text-shadow: 0 0 3px #060a12, 0 0 6px #060a12, 0 0 10px #060a12, 0 1px 2px #000;
  }
  .sys-label div {
    color: #e3eaf4; font-size: 12px; font-weight: 600; line-height: 14px;
    text-shadow: 0 0 2px #060a12, 0 0 4px #060a12, 0 1px 3px #000, 0 0 8px #060a12;
  }
  .sys-label div.hub { color: #ffffff; }
  .hide-region-labels .region-label, .hide-sys-labels .sys-label { display: none; }

  .leaflet-control-attribution {
    background: rgba(6,10,18,.7) !important; color: var(--ink-faint) !important; font-size: 10px;
  }
  .leaflet-control-attribution a { color: var(--ink-dim) !important; }
  .leaflet-control-zoom a {
    background: var(--panel) !important; color: var(--ink) !important;
    border-color: var(--panel-edge) !important;
  }
  .leaflet-top.leaflet-left { top: 50px; }
  .leaflet-tooltip.sys-tip {
    background: var(--panel); border: 1px solid var(--panel-edge); color: var(--ink);
    border-radius: 3px; font: inherit; font-size: 12px; padding: 3px 8px;
    box-shadow: none;
  }
  .leaflet-tooltip.sys-tip::before { display: none; }

  .boot {
    position: absolute; inset: 0; z-index: 2000;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink-dim); letter-spacing: .25em; font-size: 13px;
    transition: opacity .4s;
  }
  .boot.done { opacity: 0; pointer-events: none; }

  @media (max-width: 720px) {
    header { flex-wrap: wrap; gap: 8px 12px; }
    .search { flex-basis: 100%; order: 3; }
    .panel { top: auto; left: 14px; right: 14px; width: auto; max-height: 55vh; transform: translateY(calc(100% + 30px)); }
    .panel.open { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .panel, .boot { transition: none; }
  }
</style>
</head>
<body>

<div id="map" role="application" aria-label="Map of New Eden"></div>

<header>
  <div class="wordmark">NEW EDEN ATLAS<span>eve-assistant</span><span class="preview-tag"
    title="In development: built on a 2024 static data export, refresh in progress">preview</span></div>
  <div class="search">
    <input id="q" type="search" placeholder="Find a system or region  ( / )" autocomplete="off"
           aria-label="Find a system or region">
    <div class="results" id="qResults" role="listbox"></div>
  </div>
  <div class="layers" role="group" aria-label="Map layer">
    <button data-layer="risk-now" aria-pressed="true" title="Industry: gank risk right now">Risk now <small>industry</small></button>
    <button data-layer="risk-history" aria-pressed="false" title="Industry: gank risk over the last 30 days">Risk 30d</button>
    <button data-layer="pvp-kills" aria-pressed="false" title="PvP: where ships died in the last hour">PvP kills <small>pvp</small></button>
    <button data-layer="ratting" aria-pressed="false" title="PvP: where pilots are killing NPCs (targets)">Ratting</button>
    <button data-layer="status" aria-pressed="false" title="The in-game security status colors">Security</button>
  </div>
  <details class="toggles">
    <summary>Overlays</summary>
    <div class="toggle-menu">
      <label><input type="checkbox" id="tJumps" checked> stargate network</label>
      <label><input type="checkbox" id="tLabels" checked> labels</label>
      <label><input type="checkbox" id="tBulwark" checked> bulwarks</label>
      <label><input type="checkbox" id="tIce"> <i class="sw" style="border-color:#8fe3ff"></i>ice fields</label>
      <label><input type="checkbox" id="tJove"> <i class="sw" style="border-color:#b48cff;border-style:dotted"></i>Jove observatories</label>
      <label><input type="checkbox" id="tHoles"> <i class="sw" style="border-color:#ff8fd8"></i>Thera / Turnur holes</label>
    </div>
  </details>
</header>

<div class="legend">
  <div id="secLegend" hidden>
    <div class="ramp" id="ramp"></div>
    <div class="ends"><span>0.0 nullsec</span><span>highsec 1.0</span></div>
  </div>
  <div id="riskLegend">
    <div class="risk-title" id="riskTitle">Risk now for industry</div>
    <div class="risk-ramp" id="riskRamp"></div>
    <div class="risk-live" id="riskLive">loading live data…</div>
  </div>
  <div id="pvpLegend" hidden>
    <div class="risk-title" id="pvpTitle"></div>
    <div class="risk-ramp" id="pvpRamp"></div>
    <div class="risk-live" id="pvpLive"></div>
  </div>
  <div class="bulwark-key" id="bulwarkKey" hidden></div>
  <div class="stats" id="stats">loading…</div>
</div>

<aside class="panel" id="panel" aria-label="System details">
  <button class="panel-close" id="panelClose" aria-label="Close details">✕</button>
  <div class="panel-head">
    <div class="crumbs" id="pCrumbs"></div>
    <h2><span id="pName"></span><span class="sec-chip" id="pSec"></span></h2>
    <div class="sec-true" id="pSecTrue"></div>
  </div>
  <div class="panel-body">
    <div class="attr-grid" id="pAttrs"></div>
    <div class="flags" id="pFlags"></div>
    <div class="risk-box" id="pRisk"></div>
    <div class="risk-box" id="pPvp"></div>
    <div class="star-line" id="pStar"></div>
    <button class="view3d" id="view3d" hidden>Enter system view (3D)</button>
    <div class="neighbors">
      <h3>Stargate connections</h3>
      <div id="pNeighbors"></div>
    </div>
    <div class="cel" id="pPlanetsWrap">
      <h3 id="pPlanetsHead">Planets and moons</h3>
      <div id="pPlanets"></div>
    </div>
    <div class="stations" id="pStationsWrap">
      <h3 id="pStationsHead">Stations</h3>
      <ul id="pStations"></ul>
    </div>
  </div>
  <div class="panel-foot" id="pFoot"></div>
</aside>

<div id="orrery" role="region" aria-label="3D system view"></div>

<div class="boot" id="boot">CHARTING NEW EDEN</div>

<script>
"use strict";

/* The in-game star-map security ramp: deep blue core highsec, through
   cyan and green to the 0.5 yellow edge, orange-red lowsec, and the
   purple of nullsec (everything at or below 0.0). */
const SEC_COLORS = {
  "1.0":"#2c75e1","0.9":"#399aeb","0.8":"#4ecef8","0.7":"#60d9a3","0.6":"#71e452",
  "0.5":"#eeff83","0.4":"#de6a0c","0.3":"#ce4611","0.2":"#bb1014","0.1":"#6d221d","0.0":"#8f2f69",
};
const secColor = s => SEC_COLORS[Math.max(0, s).toFixed(1)] || SEC_COLORS["0.0"];

/* ---- Security Risk (industry): now and history -------------------------
   Two transparent blends, so every score can be explained in the panel.
   RISK NOW ("should I undock?")
     ganks, last 6h                          50%  (saturates at 2 ganks)
     ship kills per traffic, last hour (ESI) 25%  (1 kill per 15 jumps = max)
     structural exposure                     25%
   RISK HISTORY ("is this a bad neighborhood?")
     ganks, last 30 days                     50%  (saturates at 20 ganks)
     average hourly kills per traffic        25%  (same scale as now)
     structural exposure                     25%
   Structural exposure = trade-route chokepoint load x CONCORD response
   (tools/analyze_routes.py). With no data for a mode, the structural term
   alone shows at half weight: a quiet chokepoint reads "guarded" at most.
   Lowsec and nullsec sit outside the scale: no CONCORD, so for an
   industrial pilot they are high-risk by definition. */
const RISK_LEVELS = [
  { key: "calm",     label: "calm",     max: .12, color: "#356b77" },
  { key: "guarded",  label: "guarded",  max: .30, color: "#d4c25a" },
  { key: "elevated", label: "elevated", max: .55, color: "#e88a2e" },
  { key: "high",     label: "high",     max: 2,   color: "#ec3b2c" },
];
const RISK_OUTSIDE = { key: "outside", label: "outside highsec", color: "#4b3548" };
const riskData = { static: null, activity: null, ganks: null, history: null };
const isRiskLayer = l => l === "risk-now" || l === "risk-history";

function riskFor(p, mode = "risk-now") {
  if (p.sec < 0.5) return { level: RISK_OUTSIDE, outside: true };
  const st = riskData.static && riskData.static.systems[p.id];
  const exposure = st ? st.exposure : 0;
  let live, ganks, killRate, detail;
  if (mode === "risk-history") {
    const h = riskData.history;
    const gk = h && h.ganks[p.id];
    const [kph = 0, jph = 0] = (h && h.activity.systems[p.id]) || [];
    live = !!h && (h.oldestGank || h.activityDays > 0);
    ganks = gk ? gk.n / 10 : 0;                    // 20 ganks -> full weight
    killRate = kph / Math.max(jph, 40);
    detail = { gk, kph, jph };
  } else {
    const gk = riskData.ganks && riskData.ganks.systems[p.id];
    const [shipKills = 0, podKills = 0, , jumps = 0] =
      (riskData.activity && riskData.activity.systems[p.id]) || [];
    live = !!(riskData.activity || riskData.ganks);
    ganks = gk ? gk.n : 0;                          // 2 ganks -> full weight
    killRate = shipKills / Math.max(jumps, 40);
    detail = { gk, shipKills, podKills, jumps };
  }
  const score = live
    ? .5 * Math.min(1, ganks / 2) + .25 * Math.min(1, killRate * 15) + .25 * exposure
    : .5 * exposure;
  const level = RISK_LEVELS.find(l => score < l.max);
  return { level, score, live, st, ...detail };
}

/* marker size: hubs a touch larger; in the risk layer, hotspots grow so
   they read at any zoom */
function markerRadius(p, z) {
  let r = radiusFor(z) + (p.hub ? 1.3 : 0);
  if (isRiskLayer(currentLayer)) {
    const k = riskFor(p, currentLayer).level.key;
    r += k === "high" ? 3.5 : k === "elevated" ? 1.8 : 0;
  } else if (isPvpLayer(currentLayer)) {
    r += pvpFor(p, currentLayer).level.boost;
  }
  return r;
}

/* ---- PvP layers ---------------------------------------------------------
   Straight readings of CCP's last-hour counts for every system, all
   security levels, so a hunter can see where things are happening:
     PvP kills  ship + pod kills (where fights and ganks are happening)
     Ratting    NPC kills (where PvE pilots are farming: targets)          */
const PVP_LEVELS = {
  "pvp-kills": [
    { key: "quiet",  label: "quiet",       min: 0,  color: "#26334a", boost: 0 },
    { key: "active", label: "1-2 kills",   min: 1,  color: "#c9a23a", boost: 1 },
    { key: "hot",    label: "3-9 kills",   min: 3,  color: "#ff7a29", boost: 2.2 },
    { key: "brawl",  label: "10+ kills",   min: 10, color: "#ff2b4a", boost: 3.8 },
  ],
  "ratting": [
    { key: "none",   label: "no ratting",  min: 0,   color: "#26334a", boost: 0 },
    { key: "light",  label: "1-99 NPCs",   min: 1,   color: "#2f7f6e", boost: .6 },
    { key: "busy",   label: "100-399",     min: 100, color: "#45c49a", boost: 1.6 },
    { key: "farm",   label: "400+",        min: 400, color: "#a6f5d0", boost: 3 },
  ],
};
const isPvpLayer = l => l in PVP_LEVELS;
function pvpFor(p, layer) {
  const [ship = 0, pod = 0, npc = 0, jumps = 0] =
    (riskData.activity && riskData.activity.systems[p.id]) || [];
  const value = layer === "ratting" ? npc : ship + pod;
  const levels = PVP_LEVELS[layer];
  const level = [...levels].reverse().find(l => value >= l.min);
  return { level, ship, pod, npc, jumps, live: !!riskData.activity };
}

const fmtIsk = v => v >= 1e9 ? (v / 1e9).toFixed(1) + "B" : v >= 1e6 ? Math.round(v / 1e6) + "M"
                  : Math.round(v / 1e3) + "K";

const JUMP_STYLE = {
  local:        { color: "#3b4b6b", opacity: .34, weight: .7 },
  constellation:{ color: "#4e6f9e", opacity: .42, weight: .8 },
  regional:     { color: "#8a5fb0", opacity: .55, weight: .9 },
  /* special gate types from the SDE: these links are not ordinary travel */
  smuggler:     { color: "#c98a2c", opacity: .65, weight: 1.0, dashArray: "4 4" },
  triglavian:   { color: "#d1352f", opacity: .45, weight: 1.0, dashArray: "3 5" },
  jovian:       { color: "#e8d26a", opacity: .85, weight: 1.3, dashArray: "6 5" },
};

const map = L.map("map", {
  crs: L.CRS.Simple,
  zoomSnap: .5, zoomDelta: .5,
  minZoom: 2, maxZoom: 9,
  attributionControl: true,
  zoomControl: true,
});
map.setView([0, 0], 3); // real view comes from fitBounds once data is in
map.attributionControl.setPrefix(false);
map.attributionControl.addAttribution(
  'Map data © <a href="https://developers.eveonline.com/docs/guides/staticdata/">CCP hf. (EVE SDE)</a>, not affiliated with CCP');

const canvas = L.canvas({ padding: .3 });
const state = { byId: new Map(), adj: new Map(), markers: new Map(),
                stations: new Map(),
                selected: null, selRing: null, sysLabels: L.layerGroup() };

const SYS_LABEL_ZOOM = 6, REGION_LABEL_MAX_ZOOM = 5.5;
const radiusFor = z => Math.min(7, Math.max(1.4, 1.4 + (z - 3) * .9));

async function boot() {
  const [sysFC, jumpFC, regions, stationDb] = await Promise.all([
    fetch("data/systems.geojson").then(r => r.json()),
    fetch("data/jumps.geojson").then(r => r.json()),
    fetch("data/regions.json").then(r => r.json()),
    fetch("data/stations.json").then(r => r.json()).catch(() => ({ stations: [] })),
  ]);
  /* curated overlay: Bulwark systems (not in ESI or the static export) */
  const bulwarkDb = await fetch("data/bulwarks.json").then(r => r.json())
    .catch(() => ({ factions: {} }));

  /* relational join: stations -> their system, by solarSystemID */
  for (const st of stationDb.stations) {
    (state.stations.get(st.systemId) || state.stations.set(st.systemId, []).get(st.systemId)).push(st);
  }

  /* jump lines, grouped by class, non-interactive = cheap */
  const jumpGroups = {};
  for (const cls of Object.keys(JUMP_STYLE)) jumpGroups[cls] = [];
  for (const f of jumpFC.features) {
    const [[ax, az], [bx, bz]] = f.geometry.coordinates;
    (jumpGroups[f.properties.class] || jumpGroups.local).push([[az, ax], [bz, bx]]);
  }
  const jumpLayer = L.layerGroup(Object.entries(jumpGroups).map(([cls, lines]) =>
    L.polyline(lines, { ...JUMP_STYLE[cls], renderer: canvas, interactive: false })
  )).addTo(map);

  /* one-way links carry direction: arrow chevrons along the line, pointing
     from -> to (geometry is stored in travel order). Fixed pixel size, so
     they're re-anchored on every zoom. */
  const oneways = jumpFC.features.filter(f => f.properties.oneway);
  const arrowLayer = L.layerGroup().addTo(map);
  function drawArrows() {
    arrowLayer.clearLayers();
    if (!oneways.length) return;
    for (const f of oneways) {
      const [[ax, az], [bx, bz]] = f.geometry.coordinates;
      const p1 = map.latLngToLayerPoint([az, ax]);
      const p2 = map.latLngToLayerPoint([bz, bx]);
      const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      for (const t of [0.3, 0.5, 0.7]) {
        const cx = p1.x + (p2.x - p1.x) * t, cy = p1.y + (p2.y - p1.y) * t;
        const s = 7;
        const pt = d => map.layerPointToLatLng(
          L.point(cx + Math.cos(ang + d) * s, cy + Math.sin(ang + d) * s));
        arrowLayer.addLayer(L.polyline([pt(2.6), pt(0), pt(-2.6)], {
          renderer: canvas, color: "#e8a13c", weight: 2,
          opacity: .95, interactive: false,  // caution color: one-way travel
        }));
      }
    }
  }
  map.on("zoomend", drawArrows);

  /* systems */
  const z0 = map.getZoom() || 3, r0 = radiusFor(z0);
  const bounds = [];
  for (const f of sysFC.features) {
    const p = f.properties, [x, z] = f.geometry.coordinates;
    p.ll = [z, x];
    state.byId.set(p.id, p);
    bounds.push(p.ll);
    const m = L.circleMarker(p.ll, {
      renderer: canvas, radius: p.hub ? r0 + 1.3 : r0,
      fillColor: secColor(p.sec), fillOpacity: .95,
      color: "#060a12", weight: 1, opacity: .9,
    }).addTo(map);
    m.on("click", () => select(p.id));
    m.on("mouseover", e => m.bindTooltip(p.name, { className: "sys-tip", sticky: false, direction: "top", offset: [0, -4] }).openTooltip());
    state.markers.set(p.id, m);
  }
  for (const f of jumpFC.features) {
    const { from, to } = f.properties;
    (state.adj.get(from) || state.adj.set(from, []).get(from)).push(to);
    (state.adj.get(to) || state.adj.set(to, []).get(to)).push(from);
  }

  /* Bulwark rings: dashed faction-colored ring per system, a second ring
     on the War HQ. Joined onto the systems by ID like every other layer;
     the system record carries the attribute for the panel and 3D view. */
  const bulwarkLayer = L.layerGroup().addTo(map);
  const bulwarkRings = [];
  for (const [faction, fx] of Object.entries(bulwarkDb.factions || {})) {
    for (const b of fx.systems) {
      const p = state.byId.get(b.id);
      if (!p) continue;
      const hq = b.id === fx.warHQ;
      p.bulwark = { faction, hq, ore: fx.ore || "", site: fx.miningSite || "",
                    oresNote: bulwarkDb.campaignOresNote || "",
                    source: bulwarkDb.source || "" };
      const ring = L.circleMarker(p.ll, { renderer: canvas, interactive: false,
        fill: false, color: fx.color, weight: 2, opacity: .95, dashArray: "3 3" });
      bulwarkLayer.addLayer(ring);
      bulwarkRings.push({ m: ring, extra: 5 });
      if (hq) {
        const outer = L.circleMarker(p.ll, { renderer: canvas, interactive: false,
          fill: false, color: fx.color, weight: 1.5, opacity: .8 });
        bulwarkLayer.addLayer(outer);
        bulwarkRings.push({ m: outer, extra: 9 });
      }
    }
  }
  /* resource overlays (HISA static data): ice-field systems get a solid
     ice-blue ring, Jove Observatory systems a violet one; off by default */
  const overlayRings = { ice: [], jove: [] };
  const overlayLayers = { ice: L.layerGroup(), jove: L.layerGroup() };
  state.byId.forEach(p => {
    if (p.ice) {
      const m = L.circleMarker(p.ll, { renderer: canvas, interactive: false, fill: false,
        color: "#8fe3ff", weight: 1.6, opacity: .95 });
      overlayLayers.ice.addLayer(m);
      overlayRings.ice.push({ m, extra: 3.5 });
    }
    if (p.jove) {
      const m = L.circleMarker(p.ll, { renderer: canvas, interactive: false, fill: false,
        color: "#b48cff", weight: 1.4, opacity: .9, dashArray: "1 3" });
      overlayLayers.jove.addLayer(m);
      overlayRings.jove.push({ m, extra: 6.5 });
    }
  });
  for (const [key, id] of [["ice", "tIce"], ["jove", "tJove"]]) {
    const box = document.getElementById(id);
    box.onchange = () => box.checked ? overlayLayers[key].addTo(map) : overlayLayers[key].remove();
  }
  const sizeBulwarkRings = () => {
    const r = radiusFor(map.getZoom());
    for (const { m, extra } of [...bulwarkRings, ...overlayRings.ice, ...overlayRings.jove])
      m.setRadius(r + extra);
  };
  sizeBulwarkRings();
  map.on("zoomend", sizeBulwarkRings);
  const tBulwark = document.getElementById("tBulwark");
  tBulwark.onchange = () => tBulwark.checked ? bulwarkLayer.addTo(map) : bulwarkLayer.remove();
  /* risk inputs: structural file ships with the site; live files are
     written hourly by CI and may be absent (local runs, source outage) */
  const getJson = url => fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
  [riskData.static, riskData.activity, riskData.ganks, riskData.history] = await Promise.all([
    getJson("data/risk_static.json"), getJson("data/live/activity.json"),
    getJson("data/live/ganks.json"), getJson("data/live/history.json")]);
  riskData.wormholes = await getJson("data/live/wormholes.json");

  /* Thera / Turnur connections (EVE-Scout): Turnur is k-space, so its
     holes draw as lines out of Turnur; Thera is wormhole space and not on
     this map, so its holes mark the k-space end with a ring. */
  const holeLayer = L.layerGroup();
  const holeRings = [];
  const byName = new Map([...state.byId.values()].map(s => [s.name, s]));
  for (const c of (riskData.wormholes && riskData.wormholes.connections) || []) {
    const far = state.byId.get(c.to);
    if (!far) continue;                                  // wormhole-space end
    const hub = byName.get(c.hub);
    if (hub) {
      holeLayer.addLayer(L.polyline([hub.ll, far.ll], { renderer: canvas, interactive: false,
        color: "#ffb05a", weight: 1.4, opacity: .85, dashArray: "2 5" }));
    }
    const ring = L.circleMarker(far.ll, { renderer: canvas, interactive: false, fill: false,
      color: hub ? "#ffb05a" : "#ff8fd8", weight: 1.8, opacity: .95 });
    holeLayer.addLayer(ring);
    holeRings.push({ m: ring, extra: 5 });
  }
  const tHoles = document.getElementById("tHoles");
  tHoles.onchange = () => tHoles.checked ? holeLayer.addTo(map) : holeLayer.remove();
  const sizeHoleRings = () => {
    const r = radiusFor(map.getZoom());
    for (const { m, extra } of holeRings) m.setRadius(r + extra);
  };
  sizeHoleRings();
  map.on("zoomend", sizeHoleRings);
  document.getElementById("riskRamp").innerHTML = [...RISK_LEVELS, RISK_OUTSIDE]
    .map(l => `<span><i style="background:${l.color}"></i>${l.label}</span>`).join("");

  const key = document.getElementById("bulwarkKey");
  key.hidden = !bulwarkRings.length;
  key.innerHTML = "Bulwarks: " + Object.entries(bulwarkDb.factions || {}).map(([f, fx]) =>
      `<span class="bk-item"><i class="bk-ring" style="border-color:${fx.color}"></i>${
        f.split(" ")[0]}</span>`).join("") +
    `<span class="bk-item"><i class="bk-ring bk-hq"></i>War HQ</span>` +
    `<span class="bk-src">curated from the in-game map</span>`;

  /* labels live on their own pane, above lines, markers and arrows */
  map.createPane("labels");
  map.getPane("labels").style.zIndex = 650;
  map.getPane("labels").style.pointerEvents = "none";
  const regionLayer = L.layerGroup().addTo(map);
  state.sysLabels.addTo(map);
  const regionList = regions.regions.filter(r => r.systems > 0)
    .sort((a, b) => b.systems - a.systems);   // big regions win collisions

  function refreshRegionLabels() {
    regionLayer.clearLayers();
    const font = '700 15px "Chakra Petch", sans-serif';
    const placed = placeLabels(regionList.map(r => {
      const text = r.name.toUpperCase();
      const w = textWidth(text, font) + text.length * 15 * .2;  // + letter-spacing
      const h = 18;
      return { r, text, ll: [r.center[1], r.center[0]], w, h,
               offsets: [[-w / 2, -h / 2], [-w / 2, -h / 2 - 18], [-w / 2, -h / 2 + 18]] };
    }), [], 10);
    for (const c of placed) {
      regionLayer.addLayer(L.marker(c.ll, {
        pane: "labels", interactive: false, keyboard: false,
        icon: L.divIcon({ className: "region-label", iconSize: [0, 0],
          html: `<div style="left:${c.at[0]}px;top:${c.at[1]}px">${c.text}</div>` }),
      }));
    }
  }

  map.fitBounds(L.latLngBounds(bounds).pad(.05));
  const meta = sysFC.meta;
  const nStations = stationDb.stations.length;
  const line2 = (meta.planets ? `${meta.planets.toLocaleString()} planets, ${meta.moons.toLocaleString()} moons, ` : "")
              + (meta.belts ? `${meta.belts.toLocaleString()} belts, ` : "")
              + `${nStations.toLocaleString()} stations`;
  const provenance = meta.overlaid
    ? `<br>geography current to ${meta.overlaid} (HISA overlay); detail from the June 2024 CCP SDE`
    : `<br>CCP SDE, built ${meta.built}`;
  document.getElementById("stats").innerHTML =
    `${meta.systems.toLocaleString()} systems, ${meta.jumps.toLocaleString()} stargate links, ` +
    `${meta.regions} regions<br>${line2}${provenance}`;

  /* zoom-driven styling */
  function restyle() {
    const z = map.getZoom(), r = radiusFor(z);
    state.markers.forEach((m, id) => m.setRadius(markerRadius(state.byId.get(id), z)));
    document.body.classList.toggle("hide-region-labels", z > REGION_LABEL_MAX_ZOOM || !tLabels.checked);
    refreshRegionLabels();
    refreshSysLabels();
  }
  function refreshSysLabels() {
    state.sysLabels.clearLayers();
    if (map.getZoom() < SYS_LABEL_ZOOM || !tLabels.checked) return;
    const vb = map.getBounds().pad(.1);
    const font = '600 12px "Chakra Petch", sans-serif';
    const gap = radiusFor(map.getZoom()) + 4, h = 14;
    /* every visible system dot is an obstacle, so labels never sit on a
       neighbor's marker */
    const visible = [...state.byId.values()].filter(p => vb.contains(p.ll));
    const dots = visible.map(p => {
      const pt = map.latLngToContainerPoint(p.ll), r = radiusFor(map.getZoom()) + 1;
      return { x: pt.x - r, y: pt.y - r, w: 2 * r, h: 2 * r };
    });
    const rank = p => (p.id === state.selected ? 1e7 : 0) + (p.hub ? 1e5 : 0)
                      + p.stations * 100 + p.gates;
    const placed = placeLabels(visible.sort((a, b) => rank(b) - rank(a)).map(p => {
      const w = textWidth(p.name, font);
      return { p, text: p.name, ll: p.ll, w, h,
               offsets: [[gap, -h / 2], [-gap - w, -h / 2],
                         [-w / 2, -h - gap - 2], [-w / 2, gap + 2]] };
    }), dots);
    for (const c of placed) {
      state.sysLabels.addLayer(L.marker(c.ll, {
        pane: "labels", interactive: false, keyboard: false,
        icon: L.divIcon({ className: "sys-label", iconSize: [0, 0],
          html: `<div class="${c.p.hub ? "hub" : ""}" style="left:${c.at[0]}px;top:${c.at[1]}px">${c.text}</div>` }),
      }));
    }
  }
  map.on("zoomend", restyle);
  map.on("moveend", refreshSysLabels);

  /* toggles */
  const tJumps = document.getElementById("tJumps"), tLabels = document.getElementById("tLabels");
  tJumps.onchange = () => {
    if (tJumps.checked) { jumpLayer.addTo(map); arrowLayer.addTo(map); }
    else { jumpLayer.remove(); arrowLayer.remove(); }
  };
  tLabels.onchange = () => {
    document.body.classList.toggle("hide-sys-labels", !tLabels.checked);
    restyle();
  };

  wireSearch(regions.regions);
  restyle();
  drawArrows();

  let saved = null;
  try { saved = localStorage.getItem("atlas.layer"); } catch { /* ignore */ }
  document.querySelectorAll(".layers button:not(:disabled)").forEach(b =>
    b.onclick = () => applyLayer(b.dataset.layer));
  applyLayer(["status", "risk-history", "pvp-kills", "ratting"].includes(saved)
    ? saved : "risk-now");   // risk now is the default
  document.getElementById("boot").classList.add("done");

  const want = decodeURIComponent((location.hash.match(/^#s=(.+)/) || [])[1] || "");
  if (want) {
    const hit = [...state.byId.values()].find(p => p.name.toLowerCase() === want.toLowerCase());
    if (hit) { select(hit.id); flyTo(hit.ll, 7); }
  }
}

/* ---- layers ------------------------------------------------------------ */
let currentLayer = "risk-now";
function applyLayer(layer) {
  currentLayer = layer;
  try { localStorage.setItem("atlas.layer", layer); } catch { /* private mode */ }
  document.querySelectorAll(".layers button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.layer === layer)));
  document.getElementById("riskLegend").hidden = !isRiskLayer(layer);
  document.getElementById("pvpLegend").hidden = !isPvpLayer(layer);
  document.getElementById("secLegend").hidden = layer !== "status";
  if (isRiskLayer(layer)) updateRiskLegend(layer);
  if (isPvpLayer(layer)) updatePvpLegend(layer);
  const z = map.getZoom();
  const hot = [];
  state.markers.forEach((m, id) => {
    const p = state.byId.get(id);
    let color = secColor(p.sec), top = false;
    if (isRiskLayer(layer)) {
      const r = riskFor(p, layer); color = r.level.color; top = r.level.key === "high";
    } else if (isPvpLayer(layer)) {
      const r = pvpFor(p, layer); color = r.level.color; top = r.level.boost >= 2;
    }
    m.setStyle({ fillColor: color });
    m.setRadius(markerRadius(p, z));
    if (top) hot.push(m);
  });
  hot.forEach(m => m.bringToFront());
  if (state.selected) { renderRisk(state.byId.get(state.selected)); renderPvp(state.byId.get(state.selected)); }
}

const hhmm = iso => new Date(iso).toUTCString().slice(17, 22) + " UTC";

function updatePvpLegend(layer) {
  document.getElementById("pvpTitle").textContent = layer === "ratting"
    ? "Ratting, last hour: NPC kills (where PvE pilots are)"
    : "PvP kills, last hour: ship and pod kills";
  document.getElementById("pvpRamp").innerHTML = PVP_LEVELS[layer]
    .map(l => `<span><i style="background:${l.color}"></i>${l.label}</span>`).join("");
  const stamp = riskData.activity && riskData.activity.generated;
  document.getElementById("pvpLive").textContent = stamp
    ? `live: CCP ESI, all security levels, updated ${hhmm(stamp)}`
    : "live data unavailable here";
}

/* wormhole connections touching a system (EVE-Scout) */
function holesFor(p) {
  const conns = (riskData.wormholes && riskData.wormholes.connections) || [];
  return conns.filter(c => c.to === p.id || (c.hub === p.name));
}

function renderPvp(p) {
  const box = document.getElementById("pPvp");
  const r = pvpFor(p, "pvp-kills");
  const lines = [];
  if (r.live) {
    lines.push(`Last hour: ${r.ship} ship kills, ${r.pod} pod kills, ${r.npc} NPC kills, ${r.jumps} jumps`);
  }
  for (const c of holesFor(p)) {
    const far = c.to === p.id ? c.hub : (c.toName || "a k-space system");
    const bits = [c.type, c.maxShip && `${c.maxShip} ships`,
                  c.hoursLeft != null && `~${c.hoursLeft}h left`].filter(Boolean).join(", ");
    lines.push(`Wormhole to ${far}${bits ? ` (${bits})` : ""}`);
  }
  box.innerHTML = lines.length
    ? `<div class="rb-head"><span class="rb-level" style="color:#ff9b6a">Activity</span></div>` +
      lines.map(l => `<div class="rb-line">${l}</div>`).join("")
    : "";
}
function updateRiskLegend(layer) {
  const title = document.getElementById("riskTitle"), el = document.getElementById("riskLive");
  if (layer === "risk-history") {
    title.textContent = "Risk history for industry: last 30 days";
    const h = riskData.history;
    if (h && (h.oldestGank || h.activityDays)) {
      const since = h.oldestGank ? new Date(h.oldestGank).toISOString().slice(0, 10) : "unknown";
      el.textContent = `ganks since ${since}, ${h.activityDays} day${h.activityDays === 1 ? "" : "s"} ` +
        `of hourly kill averages; updated ${hhmm(h.generated)}`;
    } else {
      el.textContent = "history not collected yet here: structural chokepoint risk only";
    }
  } else {
    title.textContent = "Risk now for industry: last 6 hours";
    const stamp = (riskData.activity || riskData.ganks || {}).generated;
    el.textContent = stamp
      ? `live: ESI kills/jumps (last hour) + ganks (last 6h), updated ${hhmm(stamp)}`
      : "live data unavailable here: structural chokepoint risk only";
  }
}

function ganksLine(gk, label) {
  if (!gk) return `${label}: none recorded`;
  const isk = gk.isk > 0 ? ` (${fmtIsk(gk.isk)} ISK where priced)` : "";
  const top = gk.top && gk.top.length
    ? `; most hit: ${gk.top.map(([s, n]) => n > 1 ? `${s} ×${n}` : s).join(", ")}` : "";
  return `${label}: <b>${gk.n}</b>${isk}${top}`;
}

function renderRisk(p) {
  const box = document.getElementById("pRisk");
  const now = riskFor(p, "risk-now"), hist = riskFor(p, "risk-history");
  if (now.outside) {
    box.innerHTML = `<div class="rb-head"><span class="rb-level" style="color:#b07aa6">Outside highsec</span></div>
      <div class="rb-line">No CONCORD response: treat as high risk for industry.</div>`;
    return;
  }
  const lines = [];
  if (now.live) {
    lines.push(ganksLine(now.gk, "Ganks, last 6h"));
    lines.push(`Last hour: ${now.shipKills} ship kills, ${now.podKills} pod kills, ${now.jumps} jumps`);
  }
  if (hist.live) {
    lines.push(ganksLine(hist.gk, "Ganks, last 30 days"));
    if (hist.jph) lines.push(`Typical hour: ${hist.kph.toFixed(1)} ship kills in ${Math.round(hist.jph)} jumps`);
  }
  if (now.st && now.st.load > 0) {
    lines.push(`Trade-route chokepoint: carries ${now.st.load.toFixed(1)} of 10 hub-to-hub routes`);
  }
  const chip = (r, label) =>
    `<span class="rb-level" style="color:${r.level.color}">${label}: ${r.level.label}</span>`;
  box.innerHTML = `<div class="rb-head">${chip(now, "Risk now")}${chip(hist, "30-day")}</div>` +
    lines.map(l => `<div class="rb-line">${l}</div>`).join("") +
    (now.live || hist.live ? "" :
      `<div class="rb-note">Live gank and kill data unavailable: structural risk only.</div>`);
}

/* ---- label placement ------------------------------------------------- */
const _measure = document.createElement("canvas").getContext("2d");
function textWidth(text, font) { _measure.font = font; return _measure.measureText(text).width; }

/* Greedy label placement: candidates arrive best-first; each takes the
   first offset whose box clears every box already placed (and the fixed
   obstacles). Labels with no clear slot are dropped rather than drawn
   on top of each other. Returns [{...candidate, at:[dx,dy]}]. */
/* on-screen chrome (header pieces, legend, open panel, zoom buttons)
   becomes obstacles, so map labels never slide underneath it */
function uiObstacles() {
  const c = map.getContainer().getBoundingClientRect();
  return [".wordmark", ".search", ".layers", ".toggles", ".legend", ".panel.open",
          ".leaflet-control-zoom", ".leaflet-control-attribution"]
    .flatMap(sel => [...document.querySelectorAll(sel)])
    .map(el => el.getBoundingClientRect())
    .filter(r => r.width && r.height)
    .map(r => ({ x: r.left - c.left, y: r.top - c.top, w: r.width, h: r.height }));
}

function placeLabels(cands, obstacles, pad = 2) {
  const boxes = obstacles.concat(uiObstacles()), out = [];
  const hit = b => boxes.some(o => b.x < o.x + o.w + pad && o.x < b.x + b.w + pad &&
                                   b.y < o.y + o.h + pad && o.y < b.y + b.h + pad);
  for (const c of cands) {
    const pt = map.latLngToContainerPoint(c.ll);
    for (const [dx, dy] of c.offsets) {
      const b = { x: pt.x + dx, y: pt.y + dy, w: c.w, h: c.h };
      if (!hit(b)) { boxes.push(b); out.push({ ...c, at: [dx, dy] }); break; }
    }
  }
  return out;
}

function flyTo(ll, z) {
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  reduced ? map.setView(ll, z) : map.flyTo(ll, z, { duration: .9 });
}

/* ---- selection + panel ---------------------------------------------- */
function select(id) {
  const p = state.byId.get(id);
  if (!p) return;
  state.selected = id;
  if (state.selRing) state.selRing.remove();
  state.selRing = L.circleMarker(p.ll, {
    renderer: canvas, radius: radiusFor(map.getZoom()) + 5,
    color: "#ffffff", weight: 1.5, fill: false, opacity: .9, interactive: false,
  }).addTo(map);

  document.getElementById("pCrumbs").textContent = `${p.region} ‹ ${p.constellation}`;
  document.getElementById("pName").textContent = p.name;
  const chip = document.getElementById("pSec");
  chip.textContent = p.sec.toFixed(1);
  chip.style.color = secColor(p.sec);
  document.getElementById("pSecTrue").textContent = `true security ${p.secTrue.toFixed(4)}`;
  document.getElementById("pAttrs").innerHTML =
    [["planets", p.planets], ["moons", p.moons], ["belts", p.belts],
     ["stations", p.stations], ["gates", p.gates]]
    .map(([k, v]) => `<div><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");
  const flags = [p.hub && "trade-lane hub", p.border && "border system"].filter(Boolean);
  if (p.bulwark) flags.unshift(`${p.bulwark.faction} Bulwark${p.bulwark.hq ? " (War HQ)" : ""}`);
  if (p.ice) flags.push(`${p.ice} ice field${p.ice > 1 ? "s" : ""}`);
  if (p.jove) flags.push("Jove Observatory");
  if (p.partial) flags.push("new system: moons, belts and stations arrive with the next full data refresh");
  renderRisk(p);
  renderPvp(p);
  document.getElementById("pFlags").textContent = flags.join(", ") +
    (p.ores && p.ores.length ? `${flags.length ? "; " : ""}belt ores: ${p.ores.join(", ")}` : "") +
    (p.bulwark && p.bulwark.ore
      ? `; campaign ore: ${p.bulwark.ore}, ${p.bulwark.oresNote}` : "");

  const neighbors = (state.adj.get(id) || []).map(nid => state.byId.get(nid))
    .sort((a, b) => a.name.localeCompare(b.name));
  document.getElementById("pNeighbors").innerHTML = neighbors.map(n => `
    <button data-id="${n.id}">
      <span><span style="color:${secColor(n.sec)}">${n.sec.toFixed(1)}</span>&nbsp; ${n.name}</span>
      <span class="via">${n.region === p.region ? n.constellation : n.region}</span>
    </button>`).join("");
  document.querySelectorAll("#pNeighbors button").forEach(b =>
    b.onclick = () => { const nid = +b.dataset.id; select(nid); flyTo(state.byId.get(nid).ll, Math.max(map.getZoom(), 6)); });

  loadCelestials(p);

  /* stations in this system (joined by systemId) */
  const sts = state.stations.get(id) || [];
  document.getElementById("pStationsWrap").style.display = sts.length ? "" : "none";
  document.getElementById("pStationsHead").textContent = `Stations (${sts.length})`;
  const SVC_CSS = { cloning: "#e8828c", industry: "#e0a84f", market: "#74c476" };
  document.getElementById("pStations").innerHTML = sts.map(st => {
    const parts = st.name.split(" - ");
    const facility = parts.pop();
    let loc = parts.join(" - ");
    if (loc.startsWith(p.name)) loc = loc.slice(p.name.length).trim();
    const edge = SVC_CSS[st.svcClass];
    const starred = (st.svc || []).some(s => s === "Refinery" || s === "Compression");
    return `<li${edge ? ` style="border-left-color:${edge}"` : ""}` +
           `${st.svc ? ` title="${st.svc.join(", ")}"` : ""}>` +
           `${starred ? '<span style="color:#ffd966">★</span> ' : ""}` +
           `${facility}${loc ? ` <span class="at">${loc}</span>` : ""}</li>`;
  }).join("");

  document.getElementById("pFoot").textContent =
    `x ${p.ll[1].toFixed(1)} ly, z ${p.ll[0].toFixed(1)} ly, id ${p.id}`;
  document.getElementById("panel").classList.add("open");
  history.replaceState(null, "", `#s=${encodeURIComponent(p.name)}`);
}
/* celestial hierarchy: lazy-fetched per region and cached; the join runs
   region -> system -> planet -> moon entirely client-side */
const celCache = new Map();
async function loadCelestials(p) {
  document.getElementById("pStar").textContent = "";
  document.getElementById("pPlanets").innerHTML = "";
  document.getElementById("view3d").hidden = true;
  let shard = celCache.get(p.regionId);
  if (!shard) {
    try {
      shard = await fetch(`data/celestials/${p.regionId}.json`).then(r => r.json());
      celCache.set(p.regionId, shard);
    } catch { return; }
  }
  if (state.selected !== p.id) return;   // user moved on while we fetched
  const cel = shard.systems[p.id];
  if (!cel) return;

  const btn = document.getElementById("view3d");
  if (cel.planets.some(pl => pl.pos)) {   // dataset built with 3D positions
    btn.hidden = false;
    btn.onclick = () => openSystem3d(p, cel);
  }

  if (cel.star) {
    const s = cel.star;
    document.getElementById("pStar").innerHTML =
      `<b>${s.type || "Star"}</b>, ${s.tempK.toLocaleString()} K` +
      (s.spectral ? `, class ${s.spectral}` : "");
  }
  const strip = name => name && name.startsWith(p.name)
    ? name.slice(p.name.length).trim().replace(/^[-–]\s*/, "") : name;
  document.getElementById("pPlanetsWrap").style.display = cel.planets.length ? "" : "none";
  document.getElementById("pPlanetsHead").textContent =
    `Planets and moons (${cel.planets.length})`;
  document.getElementById("pPlanets").innerHTML = cel.planets.map(pl => {
    const nBelts = Array.isArray(pl.belts) ? pl.belts.length : pl.belts;
    const bits = [pl.type.replace("Planet (", "").replace(")", ""),
                  pl.moons.length ? `${pl.moons.length} moon${pl.moons.length > 1 ? "s" : ""}` : "",
                  nBelts ? `${nBelts} belt${nBelts > 1 ? "s" : ""}` : ""]
                 .filter(Boolean).join(", ");
    const stripPl = name => name && name.startsWith(pl.name)
      ? name.slice(pl.name.length).trim().replace(/^[-–]\s*/, "") : name;
    const rows = [
      ...pl.moons.map(m => `<li>${stripPl(m.name) || m.id}</li>`),
      ...(Array.isArray(pl.belts) ? pl.belts : []).map(b =>
        `<li class="belt">${stripPl(b.name) || b.id}</li>`),
    ].join("");
    if (!rows) {
      return `<details><summary class="nomoons" tabindex="-1"><span>${strip(pl.name)}</span><span class="what">${bits}</span></summary></details>`;
    }
    return `<details><summary><span>${strip(pl.name)}</span><span class="what">${bits}</span></summary><ul>${rows}</ul></details>`;
  }).join("");
}

/* the 3D system view loads on first use; the map stays live behind it */
async function openSystem3d(p, cel) {
  const host = document.getElementById("orrery");
  try {
    const { openOrrery } = await import("./orrery.js");
    openOrrery(host, {
      system: p, cel,
      stations: state.stations.get(p.id) || [],
      secColor: secColor(p.sec),
    });
  } catch (err) {
    host.style.display = "none";
    document.getElementById("pStar").innerHTML =
      "3D view needs WebGL and the three.js vendor files - " + err;
  }
}

document.getElementById("panelClose").onclick = () => {
  document.getElementById("panel").classList.remove("open");
  if (state.selRing) state.selRing.remove();
  history.replaceState(null, "", location.pathname);
};

/* ---- search ---------------------------------------------------------- */
function wireSearch(regions) {
  const q = document.getElementById("q"), box = document.getElementById("qResults");
  const systems = [...state.byId.values()];
  function close() { box.classList.remove("open"); box.innerHTML = ""; }
  function run() {
    const t = q.value.trim().toLowerCase();
    if (t.length < 2) return close();
    const starts = [], contains = [];
    for (const p of systems) {
      const n = p.name.toLowerCase();
      if (n.startsWith(t)) starts.push(p);
      else if (n.includes(t)) contains.push(p);
      if (starts.length > 8) break;
    }
    const sysHits = starts.concat(contains).slice(0, 7);
    const regHits = regions.filter(r => r.name.toLowerCase().includes(t)).slice(0, 2);
    const rows = [
      ...regHits.map(r => `<button data-kind="r" data-x="${r.center[0]}" data-z="${r.center[1]}">
          <span>${r.name}</span><span class="where">region, ${r.systems} systems</span></button>`),
      ...sysHits.map(p => `<button data-kind="s" data-id="${p.id}">
          <span><span style="color:${secColor(p.sec)}">${p.sec.toFixed(1)}</span>&nbsp; ${p.name}</span>
          <span class="where">${p.region}</span></button>`),
    ];
    box.innerHTML = rows.join("");
    box.classList.toggle("open", rows.length > 0);
    box.querySelectorAll("button").forEach(b => b.onclick = () => {
      if (b.dataset.kind === "s") { const id = +b.dataset.id; select(id); flyTo(state.byId.get(id).ll, 7); }
      else flyTo([+b.dataset.z, +b.dataset.x], 4.5);
      close(); q.value = "";
    });
  }
  q.addEventListener("input", run);
  q.addEventListener("keydown", e => {
    if (e.key === "Enter") { const first = box.querySelector("button"); if (first) first.click(); }
    if (e.key === "Escape") { close(); q.blur(); }
  });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) close(); });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === "Escape") document.getElementById("panelClose").click();
  });
}
