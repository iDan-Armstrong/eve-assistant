<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Eden Atlas</title>
<meta name="description" content="Interactive star atlas of the EVE Online universe — 5,432 solar systems, every stargate connection, full attribute data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
<style>
  :root {
    --bg: #060a12;
    --panel: #0d131f;
    --panel-edge: #1c2638;
    --ink: #c9d4e3;
    --ink-dim: #6b7891;
    --ink-faint: #3d4860;
    --focus: #9fc1ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; background: var(--bg); }
  .leaflet-container { font: inherit; }

  /* ---- top bar ---------------------------------------------------- */
  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1100;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px;
    background: linear-gradient(rgba(6,10,18,.92), rgba(6,10,18,.75) 70%, rgba(6,10,18,0));
    pointer-events: none;
  }
  header > * { pointer-events: auto; }
  .wordmark {
    font-weight: 600; letter-spacing: .34em; font-size: 15px;
    color: var(--ink); white-space: nowrap; user-select: none;
  }
  .wordmark span { color: var(--ink-dim); font-weight: 300; letter-spacing: .1em; font-size: 11px; margin-left: 10px; }

  .search { position: relative; flex: 0 1 340px; }
  .search input {
    width: 100%; padding: 7px 12px;
    background: rgba(13,19,31,.85); color: var(--ink);
    border: 1px solid var(--panel-edge); border-radius: 3px;
    font: inherit; font-size: 13px;
  }
  .search input::placeholder { color: var(--ink-faint); }
  .search input:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
  .search .results {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 3px;
    max-height: 290px; overflow-y: auto; display: none;
  }
  .search .results.open { display: block; }
  .search .results button {
    display: flex; justify-content: space-between; gap: 10px; width: 100%;
    padding: 7px 12px; background: none; border: 0; color: var(--ink);
    font: inherit; font-size: 13px; text-align: left; cursor: pointer;
  }
  .search .results button:hover, .search .results button:focus-visible { background: #16203233; outline: none; background: #162032; }
  .search .results .where { color: var(--ink-dim); font-size: 12px; }

  .toggles { display: flex; gap: 14px; margin-left: auto; }
  .toggles label {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--ink-dim); cursor: pointer; white-space: nowrap;
  }
  .toggles input { accent-color: #4a6a9b; }
  .toggles input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---- legend + stats --------------------------------------------- */
  .legend {
    position: absolute; left: 14px; bottom: 26px; z-index: 1100;
    background: rgba(13,19,31,.85); border: 1px solid var(--panel-edge); border-radius: 3px;
    padding: 9px 12px 8px; user-select: none;
  }
  .legend .ramp { display: flex; gap: 2px; margin-bottom: 5px; }
  .legend .ramp i { width: 17px; height: 8px; border-radius: 1px; }
  .legend .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-dim); }
  .legend .stats { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--panel-edge); font-size: 11px; color: var(--ink-dim); }

  /* ---- info panel -------------------------------------------------- */
  .panel {
    position: absolute; top: 56px; right: 14px; z-index: 1100;
    width: 300px; max-width: calc(100vw - 28px); max-height: calc(100vh - 92px);
    background: rgba(11,16,26,.97); backdrop-filter: blur(5px);
    border: 1px solid var(--panel-edge); border-radius: 3px;
    transform: translateX(calc(100% + 18px));
    transition: transform .25s ease;
    display: flex; flex-direction: column;
  }
  .panel.open { transform: none; }
  .panel-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--panel-edge); }
  .panel-head .crumbs { font-size: 12px; color: var(--ink-dim); margin-bottom: 3px; }
  .panel-head h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .02em; display: flex; align-items: baseline; gap: 10px; }
  .sec-chip { font-size: 16px; font-weight: 600; }
  .panel-head .sec-true { font-size: 11.5px; color: var(--ink-dim); margin-top: 2px; }
  .panel-close {
    position: absolute; top: 8px; right: 8px;
    background: none; border: 0; color: var(--ink-dim); font-size: 17px;
    cursor: pointer; padding: 4px 8px; line-height: 1; border-radius: 3px;
  }
  .panel-close:hover { color: var(--ink); }
  .panel-close:focus-visible { outline: 2px solid var(--focus); }
  .panel-body { padding: 12px 16px; overflow-y: auto; min-height: 0; }
  .attr-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
    text-align: center; margin-bottom: 4px;
  }
  .attr-grid .v { font-size: 17px; font-weight: 600; }
  .attr-grid .k { font-size: 10.5px; color: var(--ink-dim); }
  .flags { font-size: 12px; color: var(--ink-dim); margin: 8px 0 2px; min-height: 1em; }
  .neighbors h3 {
    margin: 14px 0 6px; font-size: 12px; font-weight: 400; color: var(--ink-dim);
    border-top: 1px solid var(--panel-edge); padding-top: 12px;
  }
  .neighbors button {
    display: flex; justify-content: space-between; align-items: baseline; width: 100%;
    background: none; border: 0; border-radius: 3px;
    color: var(--ink); font: inherit; font-size: 13px;
    padding: 5px 8px; cursor: pointer;
  }
  .neighbors button:hover, .neighbors button:focus-visible { background: #162032; outline: none; }
  .neighbors .via { color: var(--ink-dim); font-size: 11.5px; }
  .stations h3 {
    margin: 14px 0 6px; font-size: 12px; font-weight: 400; color: var(--ink-dim);
    border-top: 1px solid var(--panel-edge); padding-top: 12px;
  }
  .stations ul { margin: 0; padding: 0; list-style: none; }
  .stations li {
    font-size: 12px; color: var(--ink); padding: 3px 8px;
    border-left: 2px solid var(--panel-edge);
    margin-bottom: 2px; line-height: 1.35;
  }
  .stations li .at { color: var(--ink-dim); }
  .star-line { font-size: 12px; color: var(--ink-dim); margin-top: 6px; }
  .star-line b { color: var(--ink); font-weight: 400; }
  .view3d {
    margin-top: 10px; width: 100%;
    background: #16233a; color: var(--ink); border: 1px solid #2b3c5c;
    border-radius: 3px; font: inherit; font-size: 12.5px;
    padding: 6px 10px; cursor: pointer;
  }
  .view3d:hover { background: #1c2d4a; }
  .view3d:focus-visible { outline: 2px solid var(--focus); }

  /* ---- 3D system view ---------------------------------------------- */
  #orrery {
    position: absolute; inset: 0; z-index: 1500; display: none;
    background: radial-gradient(ellipse at 50% 45%, #0a101d 0%, #05080f 75%);
  }
  #orrery canvas { position: absolute; inset: 0; }
  .orr-top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 18px; pointer-events: none;
  }
  .orr-top > * { pointer-events: auto; }
  .orr-crumbs { font-size: 12px; color: var(--ink-dim); }
  .orr-title { font-size: 24px; font-weight: 600; letter-spacing: .03em; }
  .orr-title span { font-size: 16px; margin-left: 10px; }
  .orr-close {
    background: rgba(13,19,31,.85); color: var(--ink);
    border: 1px solid var(--panel-edge); border-radius: 3px;
    font: inherit; font-size: 13px; padding: 7px 14px; cursor: pointer;
  }
  .orr-close:hover { background: #162032; }
  .orr-close:focus-visible { outline: 2px solid var(--focus); }
  .orr-note {
    position: absolute; bottom: 14px; left: 18px; z-index: 2;
    font-size: 11.5px; color: var(--ink-faint); line-height: 1.9;
  }
  .orr-key { margin-right: 14px; color: var(--ink-dim); }
  .orr-key i { display: inline-block; margin-right: 5px; vertical-align: -1px; }
  .k-gate { width: 9px; height: 9px; background: #e8d26a; transform: rotate(45deg); }
  .k-station { width: 11px; height: 5px; background: #9fd9ff; }
  .k-belt { width: 10px; height: 10px;
    background: radial-gradient(circle at 30% 40%, #c9a86a 1.5px, transparent 2px),
                radial-gradient(circle at 70% 30%, #c9a86a 1.5px, transparent 2px),
                radial-gradient(circle at 55% 75%, #c9a86a 1.5px, transparent 2px); }
  .k-moon { width: 7px; height: 7px; border-radius: 50%; background: #9aa4b5; }
  .orr-label {
    position: absolute; z-index: 2; transform: translate(-50%, -160%);
    font-size: 11px; color: #aeb9cc; pointer-events: none;
    text-shadow: 0 1px 4px #05080f, 0 0 2px #05080f;
  }
  .orr-label.gate { color: #d8c470; }
  .orr-tip {
    position: absolute; z-index: 3; pointer-events: none;
    background: rgba(13,19,31,.95); border: 1px solid var(--panel-edge);
    border-radius: 3px; padding: 6px 10px; font-size: 12px; max-width: 280px;
  }
  .orr-tip b { font-weight: 600; }
  .cel h3 {
    margin: 14px 0 6px; font-size: 12px; font-weight: 400; color: var(--ink-dim);
    border-top: 1px solid var(--panel-edge); padding-top: 12px;
  }
  .cel details { margin-bottom: 2px; }
  .cel summary {
    font-size: 12.5px; padding: 4px 8px; cursor: pointer; border-radius: 3px;
    list-style-position: outside; display: flex; justify-content: space-between; gap: 8px;
  }
  .cel summary::-webkit-details-marker { display: none; }
  .cel summary:hover, .cel summary:focus-visible { background: #162032; outline: none; }
  .cel summary .what { color: var(--ink-dim); font-size: 11.5px; white-space: nowrap; }
  .cel details[open] summary { color: #e4ecf7; }
  .cel ul { margin: 2px 0 6px; padding: 0 0 0 16px; list-style: none; }
  .cel li { font-size: 11.5px; color: var(--ink-dim); padding: 1.5px 0; border-left: 2px solid var(--panel-edge); padding-left: 8px; }
  .cel li.belt { color: #a78d5c; border-left-color: #4a3f28; }
  .cel .nomoons { cursor: default; }
  .cel .nomoons:hover { background: none; }
  .panel-foot { padding: 9px 16px; border-top: 1px solid var(--panel-edge); font-size: 11px; color: var(--ink-faint); }

  /* ---- map labels --------------------------------------------------- */
  .region-label, .sys-label { background: none; border: 0; }
  .region-label div {
    color: #5e7194; font-size: 13px; font-weight: 600; letter-spacing: .28em;
    white-space: nowrap; transform: translate(-50%, -50%);
    text-shadow: 0 0 6px var(--bg), 0 0 2px var(--bg);
    opacity: .85;
  }
  .sys-label div {
    color: #93a3ba; font-size: 11px; white-space: nowrap;
    transform: translate(7px, -50%);
    text-shadow: 0 1px 3px var(--bg), 0 0 2px var(--bg);
  }
  .hide-region-labels .region-label, .hide-sys-labels .sys-label { display: none; }

  .leaflet-control-attribution {
    background: rgba(6,10,18,.7) !important; color: var(--ink-faint) !important; font-size: 10px;
  }
  .leaflet-control-attribution a { color: var(--ink-dim) !important; }
  .leaflet-control-zoom a {
    background: var(--panel) !important; color: var(--ink) !important;
    border-color: var(--panel-edge) !important;
  }
  .leaflet-top.leaflet-left { top: 50px; }
  .far-out .region-label div { font-size: 10.5px; letter-spacing: .2em; opacity: .7; }
  .leaflet-tooltip.sys-tip {
    background: var(--panel); border: 1px solid var(--panel-edge); color: var(--ink);
    border-radius: 3px; font: inherit; font-size: 12px; padding: 3px 8px;
    box-shadow: none;
  }
  .leaflet-tooltip.sys-tip::before { display: none; }

  .boot {
    position: absolute; inset: 0; z-index: 2000;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink-dim); letter-spacing: .25em; font-size: 13px;
    transition: opacity .4s;
  }
  .boot.done { opacity: 0; pointer-events: none; }

  @media (max-width: 720px) {
    header { flex-wrap: wrap; gap: 8px 12px; }
    .search { flex-basis: 100%; order: 3; }
    .panel { top: auto; left: 14px; right: 14px; width: auto; max-height: 55vh; transform: translateY(calc(100% + 30px)); }
    .panel.open { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .panel, .boot { transition: none; }
  }
</style>
</head>
<body>

<div id="map" role="application" aria-label="Map of New Eden"></div>

<header>
  <div class="wordmark">NEW EDEN ATLAS<span>eve-assistant</span></div>
  <div class="search">
    <input id="q" type="search" placeholder="Find a system or region  ( / )" autocomplete="off"
           aria-label="Find a system or region">
    <div class="results" id="qResults" role="listbox"></div>
  </div>
  <div class="toggles">
    <label><input type="checkbox" id="tJumps" checked> stargate network</label>
    <label><input type="checkbox" id="tLabels" checked> labels</label>
  </div>
</header>

<div class="legend">
  <div class="ramp" id="ramp"></div>
  <div class="ends"><span>0.0 nullsec</span><span>highsec 1.0</span></div>
  <div class="stats" id="stats">loading…</div>
</div>

<aside class="panel" id="panel" aria-label="System details">
  <button class="panel-close" id="panelClose" aria-label="Close details">✕</button>
  <div class="panel-head">
    <div class="crumbs" id="pCrumbs"></div>
    <h2><span id="pName"></span><span class="sec-chip" id="pSec"></span></h2>
    <div class="sec-true" id="pSecTrue"></div>
  </div>
  <div class="panel-body">
    <div class="attr-grid" id="pAttrs"></div>
    <div class="flags" id="pFlags"></div>
    <div class="star-line" id="pStar"></div>
    <button class="view3d" id="view3d" hidden>Enter system view (3D)</button>
    <div class="neighbors">
      <h3>Stargate connections</h3>
      <div id="pNeighbors"></div>
    </div>
    <div class="cel" id="pPlanetsWrap">
      <h3 id="pPlanetsHead">Planets and moons</h3>
      <div id="pPlanets"></div>
    </div>
    <div class="stations" id="pStationsWrap">
      <h3 id="pStationsHead">Stations</h3>
      <ul id="pStations"></ul>
    </div>
  </div>
  <div class="panel-foot" id="pFoot"></div>
</aside>

<div id="orrery" role="region" aria-label="3D system view"></div>

<div class="boot" id="boot">CHARTING NEW EDEN</div>

<script>
"use strict";

/* EVE's in-game security color set — the data carries the color. */
const SEC_COLORS = {
  "1.0":"#2fefef","0.9":"#48f0c0","0.8":"#00ef47","0.7":"#00f000","0.6":"#8fef2f",
  "0.5":"#efef00","0.4":"#d77700","0.3":"#f06000","0.2":"#f04800","0.1":"#d73000","0.0":"#f00000",
};
const secColor = s => SEC_COLORS[Math.max(0, s).toFixed(1)] || "#f00000";

const JUMP_STYLE = {
  local:        { color: "#3b4b6b", opacity: .34, weight: .7 },
  constellation:{ color: "#4e6f9e", opacity: .42, weight: .8 },
  regional:     { color: "#8a5fb0", opacity: .55, weight: .9 },
  /* special gate types from the SDE — these links are not ordinary travel */
  smuggler:     { color: "#c98a2c", opacity: .65, weight: 1.0, dashArray: "4 4" },
  triglavian:   { color: "#d1352f", opacity: .45, weight: 1.0, dashArray: "3 5" },
  jovian:       { color: "#e8d26a", opacity: .85, weight: 1.3, dashArray: "6 5" },
};

const map = L.map("map", {
  crs: L.CRS.Simple,
  zoomSnap: .5, zoomDelta: .5,
  minZoom: 2, maxZoom: 9,
  attributionControl: true,
  zoomControl: true,
});
map.setView([0, 0], 3); // real view comes from fitBounds once data is in
map.attributionControl.setPrefix(false);
map.attributionControl.addAttribution(
  'Map data © <a href="https://developers.eveonline.com/docs/guides/staticdata/">CCP hf. — EVE SDE</a>, not affiliated with CCP');

const canvas = L.canvas({ padding: .3 });
const state = { byId: new Map(), adj: new Map(), markers: new Map(),
                stations: new Map(),
                selected: null, selRing: null, sysLabels: L.layerGroup() };

const SYS_LABEL_ZOOM = 6, REGION_LABEL_MAX_ZOOM = 5.5;
const radiusFor = z => Math.min(7, Math.max(1.4, 1.4 + (z - 3) * .9));

async function boot() {
  const [sysFC, jumpFC, regions, stationDb] = await Promise.all([
    fetch("data/systems.geojson").then(r => r.json()),
    fetch("data/jumps.geojson").then(r => r.json()),
    fetch("data/regions.json").then(r => r.json()),
    fetch("data/stations.json").then(r => r.json()).catch(() => ({ stations: [] })),
  ]);

  /* relational join: stations -> their system, by solarSystemID */
  for (const st of stationDb.stations) {
    (state.stations.get(st.systemId) || state.stations.set(st.systemId, []).get(st.systemId)).push(st);
  }

  /* jump lines, grouped by class, non-interactive = cheap */
  const jumpGroups = {};
  for (const cls of Object.keys(JUMP_STYLE)) jumpGroups[cls] = [];
  for (const f of jumpFC.features) {
    const [[ax, az], [bx, bz]] = f.geometry.coordinates;
    (jumpGroups[f.properties.class] || jumpGroups.local).push([[az, ax], [bz, bx]]);
  }
  const jumpLayer = L.layerGroup(Object.entries(jumpGroups).map(([cls, lines]) =>
    L.polyline(lines, { ...JUMP_STYLE[cls], renderer: canvas, interactive: false })
  )).addTo(map);

  /* one-way links carry direction: arrow chevrons along the line, pointing
     from -> to (geometry is stored in travel order). Fixed pixel size, so
     they're re-anchored on every zoom. */
  const oneways = jumpFC.features.filter(f => f.properties.oneway);
  const arrowLayer = L.layerGroup().addTo(map);
  function drawArrows() {
    arrowLayer.clearLayers();
    if (!oneways.length) return;
    for (const f of oneways) {
      const [[ax, az], [bx, bz]] = f.geometry.coordinates;
      const p1 = map.latLngToLayerPoint([az, ax]);
      const p2 = map.latLngToLayerPoint([bz, bx]);
      const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      for (const t of [0.3, 0.5, 0.7]) {
        const cx = p1.x + (p2.x - p1.x) * t, cy = p1.y + (p2.y - p1.y) * t;
        const s = 7;
        const pt = d => map.layerPointToLatLng(
          L.point(cx + Math.cos(ang + d) * s, cy + Math.sin(ang + d) * s));
        arrowLayer.addLayer(L.polyline([pt(2.6), pt(0), pt(-2.6)], {
          renderer: canvas, color: "#e8a13c", weight: 2,
          opacity: .95, interactive: false,  // caution color: one-way travel
        }));
      }
    }
  }
  map.on("zoomend", drawArrows);

  /* systems */
  const z0 = map.getZoom() || 3, r0 = radiusFor(z0);
  const bounds = [];
  for (const f of sysFC.features) {
    const p = f.properties, [x, z] = f.geometry.coordinates;
    p.ll = [z, x];
    state.byId.set(p.id, p);
    bounds.push(p.ll);
    const m = L.circleMarker(p.ll, {
      renderer: canvas, radius: p.hub ? r0 + 1.3 : r0,
      fillColor: secColor(p.sec), fillOpacity: .95,
      color: "#060a12", weight: 1, opacity: .9,
    }).addTo(map);
    m.on("click", () => select(p.id));
    m.on("mouseover", e => m.bindTooltip(p.name, { className: "sys-tip", sticky: false, direction: "top", offset: [0, -4] }).openTooltip());
    state.markers.set(p.id, m);
  }
  for (const f of jumpFC.features) {
    const { from, to } = f.properties;
    (state.adj.get(from) || state.adj.set(from, []).get(from)).push(to);
    (state.adj.get(to) || state.adj.set(to, []).get(to)).push(from);
  }

  /* region labels */
  const regionLayer = L.layerGroup(regions.regions
    .filter(r => r.systems > 0)
    .map(r => L.marker([r.center[1], r.center[0]], {
      interactive: false, keyboard: false,
      icon: L.divIcon({ className: "region-label", html: `<div>${r.name.toUpperCase()}</div>` }),
    }))).addTo(map);
  state.sysLabels.addTo(map);

  map.fitBounds(L.latLngBounds(bounds).pad(.05));
  const meta = sysFC.meta;
  const nStations = stationDb.stations.length;
  const line2 = (meta.planets ? `${meta.planets.toLocaleString()} planets, ${meta.moons.toLocaleString()} moons, ` : "")
              + (meta.belts ? `${meta.belts.toLocaleString()} belts, ` : "")
              + `${nStations.toLocaleString()} stations — SDE ${meta.built}`;
  document.getElementById("stats").innerHTML =
    `${meta.systems.toLocaleString()} systems, ${meta.jumps.toLocaleString()} stargate links, ` +
    `${meta.regions} regions<br>${line2}`;

  /* zoom-driven styling */
  function restyle() {
    const z = map.getZoom(), r = radiusFor(z);
    state.markers.forEach((m, id) => m.setRadius(state.byId.get(id).hub ? r + 1.3 : r));
    document.body.classList.toggle("hide-region-labels", z > REGION_LABEL_MAX_ZOOM || !tLabels.checked);
    document.body.classList.toggle("far-out", z < 3.5);
    refreshSysLabels();
  }
  function refreshSysLabels() {
    state.sysLabels.clearLayers();
    if (map.getZoom() < SYS_LABEL_ZOOM || !tLabels.checked) return;
    const vb = map.getBounds().pad(.1);
    let n = 0;
    for (const [id, p] of state.byId) {
      if (!vb.contains(p.ll)) continue;
      if (++n > 500) break;
      state.sysLabels.addLayer(L.marker(p.ll, {
        interactive: false, keyboard: false,
        icon: L.divIcon({ className: "sys-label", html: `<div>${p.name}</div>` }),
      }));
    }
  }
  map.on("zoomend", restyle);
  map.on("moveend", refreshSysLabels);

  /* toggles */
  const tJumps = document.getElementById("tJumps"), tLabels = document.getElementById("tLabels");
  tJumps.onchange = () => {
    if (tJumps.checked) { jumpLayer.addTo(map); arrowLayer.addTo(map); }
    else { jumpLayer.remove(); arrowLayer.remove(); }
  };
  tLabels.onchange = () => {
    document.body.classList.toggle("hide-sys-labels", !tLabels.checked);
    restyle();
  };

  wireSearch(regions.regions);
  restyle();
  drawArrows();
  document.getElementById("boot").classList.add("done");

  const want = decodeURIComponent((location.hash.match(/^#s=(.+)/) || [])[1] || "");
  if (want) {
    const hit = [...state.byId.values()].find(p => p.name.toLowerCase() === want.toLowerCase());
    if (hit) { select(hit.id); flyTo(hit.ll, 7); }
  }
}

function flyTo(ll, z) {
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  reduced ? map.setView(ll, z) : map.flyTo(ll, z, { duration: .9 });
}

/* ---- selection + panel ---------------------------------------------- */
function select(id) {
  const p = state.byId.get(id);
  if (!p) return;
  state.selected = id;
  if (state.selRing) state.selRing.remove();
  state.selRing = L.circleMarker(p.ll, {
    renderer: canvas, radius: radiusFor(map.getZoom()) + 5,
    color: "#ffffff", weight: 1.5, fill: false, opacity: .9, interactive: false,
  }).addTo(map);

  document.getElementById("pCrumbs").textContent = `${p.region} ‹ ${p.constellation}`;
  document.getElementById("pName").textContent = p.name;
  const chip = document.getElementById("pSec");
  chip.textContent = p.sec.toFixed(1);
  chip.style.color = secColor(p.sec);
  document.getElementById("pSecTrue").textContent = `true security ${p.secTrue.toFixed(4)}`;
  document.getElementById("pAttrs").innerHTML =
    [["planets", p.planets], ["moons", p.moons], ["belts", p.belts],
     ["stations", p.stations], ["gates", p.gates]]
    .map(([k, v]) => `<div><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");
  const flags = [p.hub && "trade-lane hub", p.border && "border system"].filter(Boolean);
  document.getElementById("pFlags").textContent = flags.join(", ");

  const neighbors = (state.adj.get(id) || []).map(nid => state.byId.get(nid))
    .sort((a, b) => a.name.localeCompare(b.name));
  document.getElementById("pNeighbors").innerHTML = neighbors.map(n => `
    <button data-id="${n.id}">
      <span><span style="color:${secColor(n.sec)}">${n.sec.toFixed(1)}</span>&nbsp; ${n.name}</span>
      <span class="via">${n.region === p.region ? n.constellation : n.region}</span>
    </button>`).join("");
  document.querySelectorAll("#pNeighbors button").forEach(b =>
    b.onclick = () => { const nid = +b.dataset.id; select(nid); flyTo(state.byId.get(nid).ll, Math.max(map.getZoom(), 6)); });

  loadCelestials(p);

  /* stations in this system (joined by systemId) */
  const sts = state.stations.get(id) || [];
  document.getElementById("pStationsWrap").style.display = sts.length ? "" : "none";
  document.getElementById("pStationsHead").textContent = `Stations (${sts.length})`;
  document.getElementById("pStations").innerHTML = sts.map(st => {
    const parts = st.name.split(" - ");
    const facility = parts.pop();
    let loc = parts.join(" - ");
    if (loc.startsWith(p.name)) loc = loc.slice(p.name.length).trim();
    return `<li>${facility}${loc ? ` <span class="at">${loc}</span>` : ""}</li>`;
  }).join("");

  document.getElementById("pFoot").textContent =
    `x ${p.ll[1].toFixed(1)} ly, z ${p.ll[0].toFixed(1)} ly, id ${p.id}`;
  document.getElementById("panel").classList.add("open");
  history.replaceState(null, "", `#s=${encodeURIComponent(p.name)}`);
}
/* celestial hierarchy: lazy-fetched per region, cached — the join runs
   region -> system -> planet -> moon entirely client-side */
const celCache = new Map();
async function loadCelestials(p) {
  document.getElementById("pStar").textContent = "";
  document.getElementById("pPlanets").innerHTML = "";
  document.getElementById("view3d").hidden = true;
  let shard = celCache.get(p.regionId);
  if (!shard) {
    try {
      shard = await fetch(`data/celestials/${p.regionId}.json`).then(r => r.json());
      celCache.set(p.regionId, shard);
    } catch { return; }
  }
  if (state.selected !== p.id) return;   // user moved on while we fetched
  const cel = shard.systems[p.id];
  if (!cel) return;

  const btn = document.getElementById("view3d");
  if (cel.planets.some(pl => pl.pos)) {   // dataset built with 3D positions
    btn.hidden = false;
    btn.onclick = () => openSystem3d(p, cel);
  }

  if (cel.star) {
    const s = cel.star;
    document.getElementById("pStar").innerHTML =
      `<b>${s.type || "Star"}</b>, ${s.tempK.toLocaleString()} K` +
      (s.spectral ? `, class ${s.spectral}` : "");
  }
  const strip = name => name && name.startsWith(p.name)
    ? name.slice(p.name.length).trim().replace(/^[-–]\s*/, "") : name;
  document.getElementById("pPlanetsWrap").style.display = cel.planets.length ? "" : "none";
  document.getElementById("pPlanetsHead").textContent =
    `Planets and moons (${cel.planets.length})`;
  document.getElementById("pPlanets").innerHTML = cel.planets.map(pl => {
    const nBelts = Array.isArray(pl.belts) ? pl.belts.length : pl.belts;
    const bits = [pl.type.replace("Planet (", "").replace(")", ""),
                  pl.moons.length ? `${pl.moons.length} moon${pl.moons.length > 1 ? "s" : ""}` : "",
                  nBelts ? `${nBelts} belt${nBelts > 1 ? "s" : ""}` : ""]
                 .filter(Boolean).join(", ");
    const stripPl = name => name && name.startsWith(pl.name)
      ? name.slice(pl.name.length).trim().replace(/^[-–]\s*/, "") : name;
    const rows = [
      ...pl.moons.map(m => `<li>${stripPl(m.name) || m.id}</li>`),
      ...(Array.isArray(pl.belts) ? pl.belts : []).map(b =>
        `<li class="belt">${stripPl(b.name) || b.id}</li>`),
    ].join("");
    if (!rows) {
      return `<details><summary class="nomoons" tabindex="-1"><span>${strip(pl.name)}</span><span class="what">${bits}</span></summary></details>`;
    }
    return `<details><summary><span>${strip(pl.name)}</span><span class="what">${bits}</span></summary><ul>${rows}</ul></details>`;
  }).join("");
}

/* the 3D system view loads on first use; the map stays live behind it */
async function openSystem3d(p, cel) {
  const host = document.getElementById("orrery");
  try {
    const { openOrrery } = await import("./orrery.js");
    openOrrery(host, {
      system: p, cel,
      stations: state.stations.get(p.id) || [],
      secColor: secColor(p.sec),
    });
  } catch (err) {
    host.style.display = "none";
    document.getElementById("pStar").innerHTML =
      "3D view needs WebGL and the three.js vendor files - " + err;
  }
}

document.getElementById("panelClose").onclick = () => {
  document.getElementById("panel").classList.remove("open");
  if (state.selRing) state.selRing.remove();
  history.replaceState(null, "", location.pathname);
};

/* ---- search ---------------------------------------------------------- */
function wireSearch(regions) {
  const q = document.getElementById("q"), box = document.getElementById("qResults");
  const systems = [...state.byId.values()];
  function close() { box.classList.remove("open"); box.innerHTML = ""; }
  function run() {
    const t = q.value.trim().toLowerCase();
    if (t.length < 2) return close();
    const starts = [], contains = [];
    for (const p of systems) {
      const n = p.name.toLowerCase();
      if (n.startsWith(t)) starts.push(p);
      else if (n.includes(t)) contains.push(p);
      if (starts.length > 8) break;
    }
    const sysHits = starts.concat(contains).slice(0, 7);
    const regHits = regions.filter(r => r.name.toLowerCase().includes(t)).slice(0, 2);
    const rows = [
      ...regHits.map(r => `<button data-kind="r" data-x="${r.center[0]}" data-z="${r.center[1]}">
          <span>${r.name}</span><span class="where">region, ${r.systems} systems</span></button>`),
      ...sysHits.map(p => `<button data-kind="s" data-id="${p.id}">
          <span><span style="color:${secColor(p.sec)}">${p.sec.toFixed(1)}</span>&nbsp; ${p.name}</span>
          <span class="where">${p.region}</span></button>`),
    ];
    box.innerHTML = rows.join("");
    box.classList.toggle("open", rows.length > 0);
    box.querySelectorAll("button").forEach(b => b.onclick = () => {
      if (b.dataset.kind === "s") { const id = +b.dataset.id; select(id); flyTo(state.byId.get(id).ll, 7); }
      else flyTo([+b.dataset.z, +b.dataset.x], 4.5);
      close(); q.value = "";
    });
  }
  q.addEventListener("input", run);
  q.addEventListener("keydown", e => {
    if (e.key === "Enter") { const first = box.querySelector("button"); if (first) first.click(); }
    if (e.key === "Escape") { close(); q.blur(); }
  });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) close(); });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === "Escape") document.getElementById("panelClose").click();
  });
}

/* legend ramp */
document.getElementById("ramp").innerHTML =
  Object.keys(SEC_COLORS).sort().map(k => `<i style="background:${SEC_COLORS[k]}" title="${k}"></i>`).join("");

const tLabels = document.getElementById("tLabels");
boot().catch(err => {
  document.getElementById("boot").textContent = "Could not load map data — run tools/build_map_data.py first. " + err;
});
</script>
