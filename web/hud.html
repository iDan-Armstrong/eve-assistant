<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haul | New Eden Atlas</title>
<style>
  :root { --bg: #060a12; --panel: #0d131f; --edge: #1c2638; --ink: #e3ecf7; --dim: #8fb7ee; --faint: #5f8fd0;
          --buy: #7dff9a; --sell: #ffd24a; --pick: #7ec8ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; font-size: 17px; }
  main { padding: 14px 16px 18px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; color: var(--dim); font-size: 13px; }
  .live { display: inline-flex; align-items: center; gap: 6px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #5be37b; display: inline-block; }
  .live.off i { background: #ff4a4a; }
  .where { margin: 10px 0 4px; font-size: 15px; color: var(--dim); }
  .where b { color: var(--ink); font-size: 19px; }
  .next { margin: 12px 0; padding: 14px; border-radius: 6px; background: var(--panel); border: 2px solid var(--edge); }
  .next.buy { border-color: var(--buy); } .next.sell { border-color: var(--sell); }
  .next.pickup, .next.drop { border-color: var(--pick); }
  .act { font-size: 30px; font-weight: 800; letter-spacing: .02em; }
  .act.buy { color: var(--buy); } .act.sell { color: var(--sell); } .act.pickup, .act.drop { color: var(--pick); }
  .station { font-size: 21px; font-weight: 600; margin: 4px 0 2px; line-height: 1.25; }
  .jumps { font-size: 18px; color: var(--dim); }
  .jumps b { color: var(--ink); font-size: 26px; }
  .docked { margin-top: 8px; font-size: 18px; font-weight: 700; color: #06101a; background: var(--buy);
            border-radius: 4px; padding: 6px 10px; display: inline-block; }
  .next.sell .docked { background: var(--sell); }
  .next.pickup .docked, .next.drop .docked { background: var(--pick); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 18px; }
  th { text-align: left; font-weight: 400; font-size: 13px; color: var(--dim); border-bottom: 1px solid var(--edge); padding: 4px; }
  td { padding: 7px 4px; border-bottom: 1px solid #141c2b; vertical-align: top; }
  td.q { font-size: 22px; font-weight: 800; text-align: right; white-space: nowrap; }
  td.p { text-align: right; white-space: nowrap; color: var(--dim); font-size: 16px; }
  tr.sum td { border-bottom: 0; color: var(--dim); font-size: 16px; }
  tr.sum td.p { color: var(--ink); font-weight: 700; }
  .profit { color: var(--buy); font-weight: 800; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; font: inherit; font-size: 15px; padding: 10px; border-radius: 4px; cursor: pointer;
           background: #121b2c; color: var(--ink); border: 1px solid var(--edge); }
  button.go { background: #1d4a30; border-color: #2f7a4c; font-weight: 700; }
  .steps { margin-top: 14px; font-size: 14px; color: var(--dim); }
  .steps div { padding: 3px 0; }
  .steps .done { text-decoration: line-through; opacity: .6; }
  .steps .cur { color: var(--ink); font-weight: 700; }
  .warn { margin-top: 8px; color: #ffb03a; font-size: 15px; }
  .empty { margin-top: 40px; text-align: center; color: var(--dim); }
  .load { margin-top: 10px; width: 100%; font-size: 18px; font-weight: 800; padding: 12px; border-radius: 5px;
          background: #3a2a08; border: 2px solid var(--sell); color: var(--sell); }
  .load.ok { background: #123a1f; border-color: var(--buy); color: var(--buy); }
  .alarm { margin: 10px 0; padding: 14px; border-radius: 6px; background: #5a0d0d; border: 2px solid #ff4a4a;
           font-size: 19px; font-weight: 800; color: #fff; animation: blink 1s steps(2) infinite; }
  .alarm small { display: block; font-size: 14px; font-weight: 400; margin-top: 6px; }
  .alarm button { margin-top: 10px; background: #2a0606; border-color: #ff8a8a; }
  .check { margin-top: 8px; font-size: 14px; color: var(--dim); }
  @keyframes blink { 50% { border-color: #ffd24a; } }
</style>
</head>
<body>
<main id="hud"><div class="empty">No active haul. Send a trip from the Haul planner on the Atlas.</div></main>
<script src="sso.js"></script>
<script>
"use strict";
/* Haul window: follows the pilot through the active haul.
   Reads the trip the Atlas saved (localStorage "atlas.activeHaul"), asks
   CCP where the pilot is every 10 seconds, and shows the next stop in
   large type: what to buy or sell there, how many, and at what price.
   Docking at the stop's station shows "you are here"; undocking from it
   marks the stop done and moves on. Buttons step forward or back by hand. */
const KEY = "atlas.activeHaul";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isk = v => v >= 1e9 ? (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? (v / 1e6).toFixed(2) + "M"
          : v >= 1e3 ? (v / 1e3).toFixed(1) + "K" : v.toFixed(2);
let trip = null, here = null, ship = null, online = null, wasDockedAt = null, liveOk = true, dockedSince = null;

/* ---- left-behind cargo -------------------------------------------------------
   An alarm that cannot be missed: red banner, a beep, a flashing title. */
function raise(title, detail) {
  trip.alarm = { title, detail };
  save();
  try {
    const ctx = new AudioContext(), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "square"; o.frequency.value = 880; g.gain.value = .08;
    o.connect(g); g.connect(ctx.destination); o.start();
    [0, .25, .5].forEach((t, i) => g.gain.setValueAtTime(i % 2 ? 0 : .08, ctx.currentTime + t));
    o.stop(ctx.currentTime + .75);
  } catch { /* no audio until the window has been clicked once */ }
  let on = false;
  clearInterval(raise.flash);
  raise.flash = setInterval(() => {
    if (!trip || !trip.alarm) { clearInterval(raise.flash); document.title = "Haul | New Eden Atlas"; return; }
    document.title = (on = !on) ? "⚠ CARGO LEFT BEHIND?" : "Haul | New Eden Atlas";
  }, 700);
}

/* CCP refreshes a character's asset list about once an hour. Read it on
   undock; if it was refreshed after we docked, check now whether the goods
   are still in that station's hangar; otherwise check again as soon as
   CCP's next refresh is due (the response's Expires header). */
async function checkLeftBehind(index, stop, since) {
  const id = trip.pilot;
  try {
    const token = await EveSSO.token(id);
    let page = 1, pages = 1, assets = [], modified = 0, expires = 0;
    do {
      const r = await fetch(`https://esi.evetech.net/characters/${id}/assets?page=${page}`,
        { headers: { Authorization: `Bearer ${token}`, "X-Compatibility-Date": "2025-09-30" } });
      if (!r.ok) throw new Error(`ESI ${r.status}`);
      pages = +r.headers.get("X-Pages") || 1;
      modified = Date.parse(r.headers.get("Last-Modified")) || 0;
      expires = Date.parse(r.headers.get("Expires")) || 0;
      assets = assets.concat(await r.json());
    } while (++page <= pages);
    if (modified && modified < since) {
      const wait = Math.max(30e3, expires - Date.now() + 15e3);
      trip.check = `Cargo check for stop ${index + 1}: CCP's asset list is from ${new Date(modified).toUTCString().slice(17, 22)} UTC, ` +
        `before you docked. Checking again at ${new Date(Date.now() + wait).toUTCString().slice(17, 22)} UTC.`;
      save(); render();
      setTimeout(() => checkLeftBehind(index, stop, since), wait);
      return;
    }
    const names = new Map(stop.items.map(x => [x.name, x.n]));
    const keep = new Map(stop.items.map(x => [x.name, x.keep || 0]));
    const typeIds = await EveSSO.esiPublic("/universe/ids", [...names.keys()]).then(r => r.inventory_types || []);
    const left = typeIds.map(t => ({ name: t.name, n: assets.filter(a => a.type_id === t.id && a.location_id === stop.station
                    && a.location_flag === "Hangar").reduce((x, a) => x + a.quantity, 0) }))
                        .filter(x => x.n > (keep.get(x.name) || 0));
    if (left.length) {
      raise("Cargo left in the station hangar!", `${stop.stationName} still holds: ` +
        left.map(x => `${x.name} ×${(x.n - (keep.get(x.name) || 0)).toLocaleString()}`).join(", ") + " more than planned. Go back for it.");
      trip.check = "";
    } else {
      trip.check = `Cargo check for stop ${index + 1}: nothing from the list left in ${stop.stationName}'s hangar ✓`;
    }
    save(); render();
  } catch (e) {
    trip.check = `Cargo check for stop ${index + 1} could not read assets (${e.message}).`;
    save(); render();
  }
}

const load = () => { try { trip = JSON.parse(localStorage.getItem(KEY)); } catch { trip = null; } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(trip)); } catch { /* private mode */ } };

/* jumps from the pilot's system to a stop, along the planned path */
function jumpsTo(stop) {
  if (!here) return null;
  const path = trip.path.map(p => p.id);
  const target = path.indexOf(stop.system, Math.max(0, path.indexOf(here.system)));
  const at = path.indexOf(here.system);
  if (at < 0 || target < 0) return null;
  return Math.max(0, target - at);
}

function render() {
  const root = document.getElementById("hud");
  if (!trip) { root.innerHTML = `<div class="empty">No active haul. Send a trip from the Haul planner on the Atlas.</div>`; return; }
  const done = trip.done >= trip.stops.length;
  const s = trip.stops[Math.min(trip.done, trip.stops.length - 1)];
  const sysName = id => (trip.path.find(p => p.id === id) || {}).name || "unknown system";
  const offRoute = here && !trip.path.some(p => p.id === here.system);
  const dockedHere = here && here.station === s.station;
  const j = jumpsTo(s);
  const VERB = { buy: "BUY", sell: "SELL", pickup: "PICK UP", drop: "DROP OFF" };
  const DOCKED = { buy: "buy now", sell: "sell now", pickup: "move these to your ship's cargo", drop: "move everything to the item hangar" };
  const loads = k => k === "buy" || k === "pickup";
  let body = `<div class="top"><span>${esc(trip.pilotName || "Pilot")} · ${trip.label ? esc(trip.label) : `trip worth <span class="profit">+${isk(trip.total)}</span>`}</span>
    <span class="live${liveOk ? "" : " off"}"><i></i>${liveOk ? (online === false ? "offline in game" : "live") : "no signal"}</span></div>`;
  body += `<div class="where">Now in <b>${here ? esc(sysName(here.system) !== "unknown system" ? sysName(here.system) : here.systemName || "…") : "…"}</b>` +
    `${ship ? ` · ${esc(ship)}` : ""}</div>`;
  if (offRoute) body += `<div class="warn">Off the planned route. Autopilot will bring you back, or re-send the trip.</div>`;
  if (trip.alarm) body += `<div class="alarm">${esc(trip.alarm.title)}<small>${esc(trip.alarm.detail)}</small>
    <button id="ack">Got it</button></div>`;
  if (trip.check) body += `<div class="check">${esc(trip.check)}</div>`;
  if (done) {
    const back = here && here.system === trip.home.id;
    body += `<div class="next"><div class="act buy">${trip.label ? "All stops done" : "Trade stops done"}</div>
      <div class="station">${trip.label ? "Trip complete." : back ? "You're home." : `Head home to ${esc(trip.home.name)}`}</div></div>`;
  } else {
    const total = s.items.reduce((a, x) => a + x.total, 0);
    body += `<div class="next ${s.kind}">
      <div class="act ${s.kind}">Stop ${trip.done + 1} of ${trip.stops.length}: ${VERB[s.kind]}</div>
      <div class="station">${esc(s.stationName)}</div>
      <div class="jumps">${dockedHere ? "" : j == null ? "jumps: unknown" : j === 0 ? "<b>in this system</b>, dock up" : `<b>${j}</b> jump${j === 1 ? "" : "s"} away`}</div>
      ${dockedHere ? `<div class="docked">Docked here: ${DOCKED[s.kind]}</div>` : ""}
      ${dockedHere && loads(s.kind) ? `<button class="load${s.loaded ? " ok" : ""}" id="loaded">${s.loaded
        ? "Cargo loaded into the ship ✓" : `${s.kind === "buy" ? "Bought and moved" : "Moved"} to my ship's cargo? Tap when loaded`}</button>` : ""}
      <table><tr><th>item</th><th style="text-align:right">qty</th><th style="text-align:right">${
        s.kind === "buy" ? "price each" : s.kind === "sell" ? "buyers pay" : s.kind === "pickup" ? "worth each" : ""}</th></tr>
      ${s.items.map(x => `<tr><td>${esc(x.name)}${x.keep ? `<div class="check">leave ${x.keep.toLocaleString()} behind</div>` : ""}</td>` +
        `<td class="q">${x.n.toLocaleString()}</td><td class="p">${x.each ? isk(x.each) : ""}</td></tr>`).join("")}
      <tr class="sum"><td>${s.kind === "sell" ? "you receive after tax" : `total, ${Math.round(s.m3 || 0).toLocaleString()} m3`}</td><td></td>
        <td class="p">${total ? isk(total) : ""}</td></tr>
      ${s.kind === "sell" ? `<tr class="sum"><td>profit on this leg</td><td></td><td class="p profit">+${isk(s.profit)}</td></tr>` : ""}
      </table></div>`;
  }
  body += `<div class="row"><button id="back">Previous stop</button><button class="go" id="next">${done ? "Finish trip" : "Done here, next stop"}</button></div>`;
  body += `<div class="steps">${trip.stops.map((x, i) => `<div class="${i < trip.done ? "done" : i === trip.done ? "cur" : ""}">` +
    `${i + 1}. ${{ buy: "Buy", sell: "Sell", pickup: "Pick up", drop: "Drop off" }[x.kind]} at ${esc(x.stationName)}</div>`).join("")}
    ${trip.label ? "" : `<div class="${done ? "cur" : ""}">${trip.stops.length + 1}. Home: ${esc(trip.home.name)}</div>`}</div>`;
  root.innerHTML = body;
  const ld = document.getElementById("loaded");
  if (ld) ld.onclick = () => { s.loaded = !s.loaded; save(); render(); };
  const ack = document.getElementById("ack");
  if (ack) ack.onclick = () => { trip.alarm = null; save(); document.title = "Haul | New Eden Atlas"; render(); };
  document.getElementById("back").onclick = () => { trip.done = Math.max(0, trip.done - 1); save(); render(); };
  document.getElementById("next").onclick = () => {
    if (done) { localStorage.removeItem(KEY); trip = null; render(); return; }
    trip.done += 1; save(); render();
  };
}

/* live position: docked at the stop shows it; undocking from it advances */
async function poll() {
  load();
  if (!trip) { render(); return; }
  try {
    const id = trip.pilot;
    const [loc, sh, on] = await Promise.all([
      EveSSO.esi(id, `/characters/${id}/location`), EveSSO.esi(id, `/characters/${id}/ship`),
      EveSSO.esi(id, `/characters/${id}/online`)]);
    here = { system: loc.solar_system_id, station: loc.station_id || loc.structure_id || null };
    if (!trip.path.some(p => p.id === here.system)) {
      try { here.systemName = (await EveSSO.esiPublic(`/universe/systems/${here.system}`)).name; } catch { /* name optional */ }
    }
    try { ship = (await EveSSO.esiPublic(`/universe/types/${sh.ship_type_id}`)).name; } catch { ship = null; }
    online = on.online;
    const s = trip.stops[trip.done];
    if (s && wasDockedAt === s.station && here.station !== s.station) {
      /* leaving a buy stop: was the cargo loaded? */
      if (s.kind === "buy" || s.kind === "pickup") {
        if (!s.loaded) raise("Did you load the cargo?", `You undocked from ${s.stationName} without marking the goods as loaded. ` +
          "Check your ship's cargo hold before you jump.");
        checkLeftBehind(trip.done, s, dockedSince || Date.now() - 60e3);
      }
      trip.done += 1; save();
    }
    if (here.station && here.station !== wasDockedAt) dockedSince = Date.now();
    wasDockedAt = here.station;
    liveOk = true;
  } catch { liveOk = false; }
  render();
}

(async () => {
  const cfg = await fetch("data/sso.json").then(r => r.json()).catch(() => ({}));
  EveSSO.clientId = cfg.clientId || "";
  load(); render(); poll();
  setInterval(poll, 10000);
  addEventListener("storage", e => { if (e.key === KEY) { load(); render(); } });   /* a new trip from the Atlas */
})();
</script>
</body>
</html>
