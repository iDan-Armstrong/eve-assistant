# Cloudflare Worker: reserve-sightings relay for the New Eden Atlas.
# Deployed by Cloudflare's Git integration (Workers Builds) on every push:
# root directory "worker", deploy command "npx wrangler deploy".
# The KV namespace has no id: Wrangler 4.45+ creates and links it on the
# first deploy (automatic resource provisioning).
name = "atlas-sightings"
main = "index.js"
compatibility_date = "2025-09-01"

[vars]
CLIENT_ID = "38a2c041bdfd428ebd8cb580b750efdd"
ALLOWED_ORIGINS = "https://idan-armstrong.github.io,http://localhost:8765"

[[kv_namespaces]]
binding = "SIGHTINGS"
